plugins { id 'com.android.application' }

String appVariant = providers.gradleProperty("zaviApp").getOrElse("one")
if (!(appVariant in ["one", "admin"])) throw new GradleException("zaviApp must be one or admin")
boolean admin = appVariant == "admin"
boolean production = providers.gradleProperty("zaviProduction").getOrElse("false").toBoolean()
if (production) {
    for (String name : ["ZAVI_KEYSTORE_PATH","ZAVI_KEYSTORE_PASSWORD","ZAVI_KEY_ALIAS","ZAVI_KEY_PASSWORD"]) {
        if (!System.getenv(name)) throw new GradleException("Production signing missing: " + name)
    }
}
android {
    signingConfigs {
        production {
            if (production) {
                storeFile file(System.getenv("ZAVI_KEYSTORE_PATH"))
                storePassword System.getenv("ZAVI_KEYSTORE_PASSWORD")
                keyAlias System.getenv("ZAVI_KEY_ALIAS")
                keyPassword System.getenv("ZAVI_KEY_PASSWORD")
            }
        }
    }
    namespace 'com.zavione.mobile'
    compileSdk 36
    defaultConfig {
        applicationId admin ? 'com.zavione.one.admin' : 'com.zavione.one'
        minSdk 26
        targetSdk 36
        versionCode admin ? 4154 : 6623
        versionName admin ? '1.4.54' : '66.23'
        resValue 'string', 'app_name', admin ? 'ZAVI ONE ADMIN' : 'ZAVI ONE'
    }
    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            debuggable false
            // Interim distribution: the GitHub runner's generated debug certificate.
            // For commercial production updates, replace with persistent secure release signing.
            signingConfig production ? signingConfigs.production : signingConfigs.debug
        }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    packaging { resources { excludes += ['/META-INF/{AL2.0,LGPL2.1}'] } }
}
// Kotlin 1.8+ merges jdk7/jdk8 stdlib classes into kotlin-stdlib.
configurations.configureEach {
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
}
dependencies { implementation 'androidx.webkit:webkit:1.13.0'; implementation 'androidx.core:core:1.13.1'; implementation 'androidx.biometric:biometric:1.1.0' }
