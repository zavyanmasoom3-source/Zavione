name: ZAVI V66.16 separated AI and mic QA APKs
on:
  push:
    branches: [fix/assistant-launcher-v6608-review]
    paths: [.github/workflows/zavi-v6606-star-only-apks.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: one
            file: ZAVI_ONE_V66_06_INDEPENDENT_COMMAND_QA.apk
            sha: 6918f35169083dd1ebf52ea7c90d622d7488f8748b51d1c64900664d81b73cc6
          - app: admin
            file: ZAVI_ONE_ADMIN_V1_4_52_INDEPENDENT_COMMAND_QA.apk
            sha: 8669b9a02488136dac68deeaf4bff074114c0f3c38e9c90e74387db36ab6445f
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Download and validate original APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p original
          gh release download zavi-migration-v6606 --repo "${{ github.repository }}" --pattern "${{ matrix.file }}" --dir original
          echo "${{ matrix.sha }}  original/${{ matrix.file }}" | sha256sum -c -
      - name: Stage original web assets
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import zipfile,shutil
          apk=Path("original/${{ matrix.file }}")
          dst=Path("android-build/app/src/main/assets")
          if dst.exists():shutil.rmtree(dst)
          dst.mkdir(parents=True)
          with zipfile.ZipFile(apk) as z:
           assert z.testzip() is None
           names=[n for n in z.namelist() if n.startswith("assets/") and not n.endswith("/") and not n.startswith("assets/dexopt/")]
           assert len(names)>100, len(names)
           for name in names:
            rel=Path(name).relative_to("assets")
            assert ".." not in rel.parts
            target=dst/rel
            target.parent.mkdir(parents=True,exist_ok=True)
            target.write_bytes(z.read(name))
          assert (dst/"index.html").exists()
          print("Staged",len(names),"original assets")
          PY
      - name: Apply assistant, recovery and login fixes
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import shutil
          assets=Path("android-build/app/src/main/assets")
          html=assets/"index.html"
          s=html.read_text(encoding="utf-8")
          name="zavi-single-assistant-fix-v6608.js"
          shutil.copy2(Path("design-system")/name,assets/name)
          marker='<script defer src="./'+name+'?v=66.08"></script>'
          assert marker not in s
          pos=s.lower().rfind("</body>")
          assert pos!=-1
          s=s[:pos]+marker+s[pos:]
          html.write_text(s,encoding="utf-8")
          css='zavi-three-visual-fixes-v6611.css'
          shutil.copy2(Path('design-system')/css,assets/css)
          head=s.lower().find('</head>')
          assert head>=0
          s=s[:head]+f'<link rel="stylesheet" href="./{css}?v=66.11">'+s[head:]
          html.write_text(s,encoding='utf-8')
          extra='zavi-actual-login-star-v6612.css'
          shutil.copy2(Path('design-system')/extra,assets/extra)
          s=html.read_text(encoding='utf-8')
          head=s.lower().find('</head>')
          assert head>=0
          s=s[:head]+f'<link rel="stylesheet" href="./{extra}?v=66.13">'+s[head:]
          html.write_text(s,encoding='utf-8')
          if '${{ matrix.app }}' == 'one':
           for name in ('zavi-store-recovery-v6594.css','zavi-store-recovery-v6594.js'):
            shutil.copy2(Path('design-system')/name,assets/name)
           s=html.read_text(encoding='utf-8')
           s=s.replace('</head>','<link rel="stylesheet" href="./zavi-store-recovery-v6594.css?v=66.14"></head>',1)
           s=s.replace('</body>','<script defer src="./zavi-store-recovery-v6594.js?v=66.14"></script></body>',1)
           html.write_text(s,encoding='utf-8')
           name='zavi-transfer-auto-lease-v6615.js'
           shutil.copy2(Path('design-system')/name,assets/name)
           s=html.read_text(encoding='utf-8')
           s=s.replace('</body>',f'<script defer src="./{name}?v=66.15"></script></body>',1)
           html.write_text(s,encoding='utf-8')
          # The star belongs to the command launcher's own JS, not to the AI assistant.
          # Keep the original AI assistant untouched; expose a separate mic launcher.
          command=assets/'zavi-dual-command-v6605.js'
          assert command.exists(), 'Missing original voice/text command center'
          source=command.read_text(encoding='utf-8')
          old="launcher=create('button','z605-launch','✦')"
          assert source.count(old)==1, 'Voice launcher signature changed'
          source=source.replace(old,"launcher=create('button','z605-launch','🎙️')",1)
          command.write_text(source,encoding='utf-8')
          mic_css='zavi-separated-ai-mic-v6616.css'
          shutil.copy2(Path('design-system')/mic_css,assets/mic_css)
          s=html.read_text(encoding='utf-8')
          s=s.replace('</head>',f'<link rel="stylesheet" href="./{mic_css}?v=66.16"></head>',1)
          html.write_text(s,encoding='utf-8')
          assert '✦' not in command.read_text(encoding='utf-8').split("launcher=create('button','z605-launch',",1)[1].split(')',1)[0]
          assert '#z637AiButton,.z637-ai-button{display:none' not in (assets/'zavi-actual-login-star-v6612.css').read_text(encoding='utf-8')
          print('Preserved AI assistant; separated microphone with voice and text commands')
          PY
          node --check android-build/app/src/main/assets/zavi-dual-command-v6605.js
          node --check android-build/app/src/main/assets/zavi-single-assistant-fix-v6608.js
          if [ '${{ matrix.app }}' = 'one' ]; then node --check android-build/app/src/main/assets/zavi-transfer-auto-lease-v6615.js; fi
      - name: Reject malformed HTML before building APK
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser
          class Visible(HTMLParser):
           def __init__(self): super().__init__(); self.hidden=0; self.blocks=[]
           def handle_starttag(self,t,a):
            if t in ('script','style'):self.hidden+=1
           def handle_endtag(self,t):
            if t in ('script','style'):self.hidden=max(0,self.hidden-1)
           def handle_data(self,d):
            if not self.hidden and d.strip():self.blocks.append(d.strip())
          p=Path('android-build/app/src/main/assets/index.html')
          s=p.read_text(encoding='utf-8')
          v=Visible();v.feed(s)
          suspicious=[x[:160] for x in v.blocks if ('function ' in x or 'const ' in x or '=>{' in x or 'document.' in x) and len(x)>250]
          print('HTML bytes:',len(s),'visible code blocks:',len(suspicious),'examples:',suspicious[:3])
          assert not suspicious,'Visible JavaScript source detected in app HTML: refuse APK release'
          PY
      - name: Stage distinct ZAVI launcher icons
        run: |
          mkdir -p android-build/app/src/main/res/drawable-nodpi
          if [ '${{ matrix.app }}' = 'admin' ]; then
            cp android-build/icons/admin.webp android-build/app/src/main/res/drawable-nodpi/zavi_owner_logo.webp
          else
            cp android-build/icons/one.webp android-build/app/src/main/res/drawable-nodpi/zavi_owner_logo.webp
          fi
      - name: Install Android SDK
        run: |
          set -euo pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install 'platforms;android-36' 'build-tools;36.0.0'
      - name: Restore required Android launcher resource
        run: |
          mkdir -p android-build/app/src/main/res/drawable
          cp android-build/app/src/main/res/drawable/ic_launcher.xml android-build/app/src/main/res/drawable/zavi_launcher_image.xml
      - name: Build and verify APK
        working-directory: android-build
        run: |
          gradle --no-daemon :app:assembleRelease -PzaviApp=${{ matrix.app }}
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify app/build/outputs/apk/release/app-release.apk
      - uses: actions/upload-artifact@v4
        with:
          name: ZAVI_${{ matrix.app }}_V6606_STAR_ONLY_QA
          path: android-build/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
