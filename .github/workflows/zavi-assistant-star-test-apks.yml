name: ZAVI assistant star-only Android test APKs
on:
  push:
    branches: [fix/assistant-launcher-v6608-review]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: one
            original: industry-delivery/ZAVI_ONE_UNIFIED_20_BUSINESSES_V65_83_TRIAL7_REAL_OFFLINE_QA.apk
            sha: fee4ae8ec59a8d433f95c631fe26dfd46fcb8d4916aca01ed5b3090cf5a4d018
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Install Android SDK
        run: |
          set -euo pipefail
          M="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$M" ]; then M="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -1)"; fi
          yes | "$M" --licenses >/dev/null || true
          "$M" --install 'platforms;android-36' 'build-tools;36.0.0'
      - name: Regression test
        run: node design-system/test_assistant_star_only_v6608.cjs
      - name: Prepare original APK
        run: |
          set -euo pipefail
          mkdir -p industry-delivery
          echo "${{ matrix.sha }}  ${{ matrix.original }}" | sha256sum -c
      - name: Bundle offline barcode scanner
        run: |
          npm install --prefix design-system --no-save --no-package-lock --ignore-scripts --no-audit --no-fund esbuild@0.25.12 @zxing/browser@0.2.1
          ./design-system/node_modules/.bin/esbuild design-system/zavi-zxing-entry-v6591.js --bundle --format=iife --target=es2020 --minify --outfile=design-system/zavi-zxing-bundle-v6591.js
          test "$(wc -c < design-system/zavi-zxing-bundle-v6591.js)" -gt 80000
      - name: Stage app and apply badge-only patch
        run: |
          set -euo pipefail
          python3 design-system/build_android_v6598.py --app "${{ matrix.app }}" --apk "${{ matrix.original }}" --expected-sha "${{ matrix.sha }}"
          python3 design-system/apply_single_assistant_v6608.py
          node --check android-build/app/src/main/assets/zavi-single-assistant-fix-v6608.js
          python3 - <<'PYTEST'
          from pathlib import Path
          s=Path('android-build/app/src/main/assets/index.html').read_text()
          marker='<script defer src="./zavi-single-assistant-fix-v6608.js?v=66.08"></script>'
          assert s.count(marker)==1
          assert s.rfind(marker)>s.rfind('</head>')
          assert s.rfind(marker)<s.rfind('</body>')
          assert s.rfind('</body>')<s.rfind('</html>')
          assert s.count('document.write(content)')>=1
          print('PASS: injected outside JavaScript invoice templates')
          PYTEST
      - name: Build debug APK
        working-directory: android-build
        run: gradle --no-daemon :app:assembleDebug -PzaviAdmin=${{ matrix.app == 'admin' }}
      - name: Verify signed APK
        run: |
          set -euo pipefail
          APK=android-build/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify "$APK"
      - uses: actions/upload-artifact@v4
        with:
          name: ZAVI_${{ matrix.app }}_ASSISTANT_STAR_TEST_APK
          path: android-build/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
