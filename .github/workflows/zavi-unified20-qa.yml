name: Build unified ZAVI ONE twenty-trade QA APK
on:
  push:
    branches: [zavi-v6574-one-app-20-businesses-qa]
    paths:
      - '.github/workflows/zavi-unified20-qa.yml'
      - 'industry-build/unified20.js'
      - 'industry-build/unified20.css'
      - 'industry-build/prepare_unified.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  unified-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Install Android build tools
        shell: bash
        run: |
          set -euo pipefail
          M="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$M" ];then M="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -1)";fi
          yes | "$M" --licenses >/dev/null || true
          "$M" --install "platforms;android-36" "build-tools;36.0.0"
      - name: Extract validated complete master and add twenty dynamic trade profiles
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p staging
          gh release download zavi-6572-admin1419-trial7-offline-assistant-qa-20261026 --pattern 'ZAVI_ONE_V65_72_OFFLINE_ASSISTANT_QA.apk*' --dir staging
          sha="$(awk 'NR==1{print $1}' staging/ZAVI_ONE_V65_72_OFFLINE_ASSISTANT_QA.apk.sha256)"
          echo "$sha  staging/ZAVI_ONE_V65_72_OFFLINE_ASSISTANT_QA.apk" | sha256sum -c
          python3 industry-build/prepare_unified.py --apk staging/ZAVI_ONE_V65_72_OFFLINE_ASSISTANT_QA.apk --web android-build/app/src/main/assets
          node --check android-build/app/src/main/assets/zavi-unified20.js
          python3 - <<'PY'
          from pathlib import Path
          import json
          a=Path('android-build/app/src/main/assets')
          profiles=json.loads((a/'zavi-unified20-manifest.json').read_text())['profiles']
          assert len(profiles)==len({x['id'] for x in profiles})==20
          for page in ('index.html','v25-business.html'):
              html=(a/page).read_text()
              assert 'window.ZAVI_UNIFIED_PROFILES=' in html
              assert 'zavi-unified20.js?v=65.74-qa' in html
          for asset in ('offline-license-secure.js','zavi-v6572-store-trial7.js','zavi-v6570-store-offline.js'):
              assert (a/asset).is_file(),asset
          PY
      - name: Set isolated QA Android identity and retain original app security
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('android-build/app/build.gradle')
          s=p.read_text()
          pairs={
              "admin ? 'com.zavione.one.admin' : 'com.zavione.one'":"admin ? 'com.zavione.one.admin' : 'com.zavione.one.unified20.qa'",
              "versionCode admin ? 4127 : 6554":"versionCode admin ? 4127 : 657400",
              "versionName admin ? '1.3.7' : '65.54'":"versionName admin ? '1.3.7' : '65.74-unified20-qa'",
              "admin ? 'ZAVI ONE ADMIN' : 'ZAVI ONE'":"admin ? 'ZAVI ONE ADMIN' : 'ZAVI ONE 20 Businesses QA'"
          }
          for old,new in pairs.items():
              assert s.count(old)==1,old
              s=s.replace(old,new)
          assert 'targetSdk 36' in s and 'signingConfig signingConfigs.debug' in s
          p.write_text(s)
          PY
          mkdir -p android-build/app/src/main/res/drawable-nodpi
          cp android-build/icons/one.webp android-build/app/src/main/res/drawable-nodpi/zavi_launcher_image.webp
      - name: Build and verify one signed APK
        shell: bash
        run: |
          set -euo pipefail
          (cd android-build && gradle --no-daemon -PzaviApp=one :app:assembleRelease)
          APK=android-build/app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$APK" | grep -F 'Verified using v2 scheme'
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | grep -F "package: name='com.zavione.one.unified20.qa'"
          unzip -t "$APK" | tail -n 1
          unzip -Z1 "$APK" | grep -Fx assets/zavi-unified20.js
          unzip -Z1 "$APK" | grep -Fx assets/zavi-v6572-store-trial7.js
          mkdir -p industry-delivery
          cp "$APK" industry-delivery/ZAVI_ONE_UNIFIED_20_BUSINESSES_V65_74_QA.apk
          (cd industry-delivery && sha256sum ZAVI_ONE_UNIFIED_20_BUSINESSES_V65_74_QA.apk > ZAVI_ONE_UNIFIED_20_BUSINESSES_V65_74_QA.apk.sha256)
          echo 'Twenty selectable business types in one QA APK. Save type from authenticated owner settings. Prior app data does not migrate automatically. Do not uninstall old app; QA signature is temporary.' > industry-delivery/README_UNIFIED20_QA.txt
      - name: Publish one QA APK to private branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'ZAVI QA'
          git config user.email 'zavi-unified20-qa@users.noreply.github.com'
          git add industry-delivery/ZAVI_ONE_UNIFIED_20_BUSINESSES_V65_74_QA.apk industry-delivery/ZAVI_ONE_UNIFIED_20_BUSINESSES_V65_74_QA.apk.sha256 industry-delivery/README_UNIFIED20_QA.txt
          git commit -m 'artifact(android): unified 20-business 65.74 QA APK'
          git push origin HEAD:zavi-v6574-one-app-20-businesses-qa
