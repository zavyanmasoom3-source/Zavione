name: ZAVI ONE V65.67 and ADMIN V1.4.14 QA APKs Combined ZIP
on:
  push:
    branches: [zavi-v6567-readable-menu-admin-design-20261025]
    paths:
      - ".github/workflows/zavi-v6567-both-apks-zip.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  bundle:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Check both release APK signatures, hashes and UI content
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p package
          gh release download zavi-v6567-aligned-design-apks-20261025 \
            --pattern 'ZAVI_ONE_V65_67_READABLE_ALL_SECTIONS_QA.apk*' --dir package
          gh release download zavi-v6567-aligned-design-apks-20261025 \
            --pattern 'ZAVI_ONE_ADMIN_V1_4_14_MATCHED_DESIGN_QA.apk*' --dir package
          cd package
          for f in ZAVI_ONE_V65_67_READABLE_ALL_SECTIONS_QA.apk ZAVI_ONE_ADMIN_V1_4_14_MATCHED_DESIGN_QA.apk;do
            test -s "$f"
            expected="$(awk 'NR==1{print $1}' "$f.sha256")"
            printf '%s  %s\n' "$expected" "$f" | sha256sum --check
            unzip -t "$f" | tail -n1
            unzip -Z1 "$f" | grep -Fx classes.dex
            unzip -Z1 "$f" | grep -Fx assets/index.html
          done
          unzip -Z1 ZAVI_ONE_V65_67_READABLE_ALL_SECTIONS_QA.apk | grep -Fx assets/zavi-v6567-sections-readable.css
          unzip -Z1 ZAVI_ONE_V65_67_READABLE_ALL_SECTIONS_QA.apk | grep -Fx assets/zavi-v6567-sections-readable.js
          unzip -Z1 ZAVI_ONE_ADMIN_V1_4_14_MATCHED_DESIGN_QA.apk | grep -Fx assets/zavi-admin-v1414-one-matched.css
          unzip -Z1 ZAVI_ONE_ADMIN_V1_4_14_MATCHED_DESIGN_QA.apk | grep -Fx assets/zavi-admin-v1414-one-matched.js
          unzip -p ZAVI_ONE_V65_67_READABLE_ALL_SECTIONS_QA.apk assets/index.html | grep -q 'zavi-v6567-sections-readable.js'
          unzip -p ZAVI_ONE_ADMIN_V1_4_14_MATCHED_DESIGN_QA.apk assets/index.html | grep -q 'zavi-admin-v1414-one-matched.js'
          sha256sum *.apk > SHA256_CHECKSUMS.txt
          cat > README_DARI.txt <<'README'
          ZAVI ONE V65.67 + ZAVI ONE ADMIN V1.4.14
          Android QA package, 25 October 2026.

          فایل 1: ZAVI_ONE_V65_67_READABLE_ALL_SECTIONS_QA.apk
          در منوی «همه بخش‌ها» ارتفاع کارت‌ها خودکار است و متن کامل دیده می‌شود.

          فایل 2: ZAVI_ONE_ADMIN_V1_4_14_MATCHED_DESIGN_QA.apk
          رنگ، کارت‌ها و منوی مدیریت مرکزی مشابه طراحی ZAVI ONE شده است.

          هردو APK شناسه مستقل آزمایشی دارند. برنامه اصلی را حذف نکنید.
          داده‌های نسخه قبلی خودکار به این APK منتقل نمی‌شوند.
          قبل از انتقال دستگاه، موجودی و تراکنش‌های ارسال‌نشده را همگام‌سازی
          و از اطلاعات، نسخه پشتیبان تأییدشده تهیه کنید.

          مهم: ساخت و امضای آزمایشی و فایل‌های داخل APK بررسی شده‌اند.
          این بسته هنوز برای انتشار عمومی تأیید نهایی نشده:
          آزمون واقعی موبایل، ورود ابری، کمره بارکد، چاپ، آفلاین،
          انتقال دستگاه، بررسی مالک/غیرمالک در ADMIN و امضای
          اختصاصی انتشار (production signing) ضرورت دارد.
          README
          cd ..
          zip -9 -q -j ZAVI_ONE_6567_ADMIN_1414_APKS_QA_2026_10_25.zip \
            package/ZAVI_ONE_V65_67_READABLE_ALL_SECTIONS_QA.apk \
            package/ZAVI_ONE_ADMIN_V1_4_14_MATCHED_DESIGN_QA.apk \
            package/SHA256_CHECKSUMS.txt package/README_DARI.txt
          unzip -t ZAVI_ONE_6567_ADMIN_1414_APKS_QA_2026_10_25.zip | tail -1
          test "$(unzip -Z1 ZAVI_ONE_6567_ADMIN_1414_APKS_QA_2026_10_25.zip | grep -c '\.apk$')" -eq 2
          sha256sum ZAVI_ONE_6567_ADMIN_1414_APKS_QA_2026_10_25.zip > ZAVI_ONE_6567_ADMIN_1414_APKS_QA_2026_10_25.zip.sha256
      - name: Publish QA ZIP for both apps
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: zavi-v6567-both-apks-zip-20261025
        run: |
          set -euo pipefail
          if ! gh release view "$TAG" >/dev/null 2>&1;then
            gh release create "$TAG" --target "$GITHUB_SHA" --prerelease \
              --title "ZAVI ONE 65.67 + ADMIN 1.4.14 | Android QA APKs" \
              --notes "Two separate QA-signed Android apps in one checked ZIP. Full module label visibility repaired for shop; owner ADMIN UI aligned with shop. No change to original cloud/accounting/authorization. Real phone tests and production signing required before public publication."
          fi
          gh release upload "$TAG" \
            ZAVI_ONE_6567_ADMIN_1414_APKS_QA_2026_10_25.zip \
            ZAVI_ONE_6567_ADMIN_1414_APKS_QA_2026_10_25.zip.sha256 --clobber
