name: Build PDF-final QA APKs

on:
  push:
    branches: [dev]
    paths:
      - 'release/build-pdf-final-qa.trigger'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android-qa:
    name: Build tested PDF-final QA APKs
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Verify source tests
        run: node --test tests/*.test.cjs
      - name: Build ZAVI ONE QA
        run: |
          rm -rf android-build/app/src/main/assets
          mkdir -p android-build/app/src/main/assets release
          cp -a app-source/one/. android-build/app/src/main/assets/
          chmod +x android-build/gradlew
          ./android-build/gradlew -p android-build --no-daemon -PzaviApp=one :app:assembleDebug
          cp android-build/app/build/outputs/apk/debug/app-debug.apk release/ZAVI_ONE_66.76_pdf_final_QA.apk
      - name: Build ZAVI ONE ADMIN QA
        run: |
          rm -rf android-build/app/src/main/assets
          mkdir -p android-build/app/src/main/assets
          cp -a app-source/admin/. android-build/app/src/main/assets/
          ./android-build/gradlew -p android-build --no-daemon -PzaviApp=admin :app:assembleDebug
          cp android-build/app/build/outputs/apk/debug/app-debug.apk release/ZAVI_ONE_ADMIN_1.4.67_pdf_final_QA.apk
      - name: Verify QA APK identities and new PDF assets
        run: |
          AAPT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/aapt"
          "$AAPT" dump badging release/ZAVI_ONE_66.76_pdf_final_QA.apk | grep "versionCode='6676' versionName='66.76-pdf-final-debug'"
          "$AAPT" dump badging release/ZAVI_ONE_ADMIN_1.4.67_pdf_final_QA.apk | grep "versionCode='4167' versionName='1.4.67-pdf-final-debug'"
          unzip -l release/ZAVI_ONE_66.76_pdf_final_QA.apk | grep 'assets/zavi-pdf-final-v6760.css'
          unzip -l release/ZAVI_ONE_ADMIN_1.4.67_pdf_final_QA.apk | grep 'assets/zavi-admin-pdf-final-v1467.css'
      - uses: actions/upload-artifact@v4
        with:
          name: ZAVI-PDF-final-QA-APKs
          path: release/*.apk
          if-no-files-found: error
          retention-days: 14
      - name: Publish QA release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: qa-66.76-pdf-final
          name: ZAVI PDF-final QA 66.76
          prerelease: true
          generate_release_notes: false
          files: release/*.apk
          fail_on_unmatched_files: true
          overwrite_files: true
