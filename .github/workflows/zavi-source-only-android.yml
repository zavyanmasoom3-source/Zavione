name: ZAVI source-only Android build
on:
  workflow_dispatch:
  push:
    branches: [main, fix/independent-source-release-20261103]
    paths:
      - 'app-source/**'
      - 'android-build/**'
      - '.github/workflows/zavi-source-only-android.yml'
permissions:
  contents: read
jobs:
  browser-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify original source references, purchase and WhatsApp invariants
        run: |
          node tests/source-feature-parity.cjs
          node --test tests/purchase-finance.test.cjs tests/whatsapp.test.cjs
          python3 -m unittest discover -s tests -v
      - name: Install pinned browser test runtime
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Exercise actual app menus, login gates, accounting and device layouts
        run: |
          set -euo pipefail
          python3 -m http.server 8765 --bind 127.0.0.1 --directory app-source > /tmp/zavi-http.log 2>&1 &
          node tests/browser-source.cjs
          node tests/warehouse-browser.cjs
          node tests/barcode-browser.cjs
          node tests/command-parity-browser.cjs
          node tests/display-parity-browser.cjs
          node tests/admin-owner-panel-browser.cjs
          node tests/menu-parity-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: source-only-pre-build-test-evidence
          path: |
            browser-source-results.json
            menu-parity-results.json
            qa-parity-results.json
          if-no-files-found: warn

  source-only:
    needs: browser-gate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [one, admin]
    steps:
      - uses: actions/checkout@v4
      - name: Require all known original accounting modules and command entry points
        run: node tests/source-feature-parity.cjs
      - name: Test recovery safeguards
        run: python3 -m unittest discover -s tests -v
      - name: Require complete independent source (never extract a legacy APK)
        env:
          ZAVI_APP: ${{ matrix.app }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import importlib.util, os
          spec=importlib.util.spec_from_file_location('recovery','scripts/recover-independent-source.py')
          module=importlib.util.module_from_spec(spec);spec.loader.exec_module(module)
          root=Path('app-source')/os.environ['ZAVI_APP']
          module.validate(root)
          print('Validated independent source and local dependencies:',root)
          PY
      - name: Stage independent application source
        env:
          ZAVI_APP: ${{ matrix.app }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os,shutil
          src=Path('app-source')/os.environ['ZAVI_APP']
          dst=Path('android-build/app/src/main/assets')
          if dst.exists(): shutil.rmtree(dst)
          shutil.copytree(src,dst)
          assert (dst/'index.html').is_file()
          PY
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Install Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install 'platforms;android-36' 'build-tools;36.0.0'
      - name: Build and verify source-only APK
        working-directory: android-build
        run: |
          set -euo pipefail
          cp app/src/main/res/drawable/ic_launcher.xml app/src/main/res/drawable/zavi_launcher_image.xml
          gradle --no-daemon :app:assembleDebug -PzaviApp=${{ matrix.app }} -PzaviProduction=false
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify app/build/outputs/apk/debug/app-debug.apk
      - name: Check exact QA APK size and do not claim it contains offline voice model
        working-directory: android-build
        run: |
          python3 - <<'PY'
          from pathlib import Path
          apk=Path('app/build/outputs/apk/debug/app-debug.apk')
          size=apk.stat().st_size
          print('QA APK bytes:',size)
          if size > 6_000_000:
              raise SystemExit('QA size exceeded 6 MB target; audit new assets; DO NOT remove live features to shrink.')
          print('Low APK size excludes bundled native offline voice; feature is not production-certified.')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: ZAVI_${{ matrix.app }}_SOURCE_ONLY_QA_APK
          path: android-build/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  signing-readiness:
    runs-on: ubuntu-latest
    steps:
      - name: Audit existing per-app signing secrets without reading their values
        env:
          ZAVI_ONE_KEYSTORE_BASE64: ${{ secrets.ZAVI_ONE_KEYSTORE_BASE64 }}
          ZAVI_ONE_STORE_PASSWORD: ${{ secrets.ZAVI_ONE_STORE_PASSWORD }}
          ZAVI_ONE_KEY_ALIAS: ${{ secrets.ZAVI_ONE_KEY_ALIAS }}
          ZAVI_ONE_KEY_PASSWORD: ${{ secrets.ZAVI_ONE_KEY_PASSWORD }}
          ZAVI_ADMIN_KEYSTORE_BASE64: ${{ secrets.ZAVI_ADMIN_KEYSTORE_BASE64 }}
          ZAVI_ADMIN_STORE_PASSWORD: ${{ secrets.ZAVI_ADMIN_STORE_PASSWORD }}
          ZAVI_ADMIN_KEY_ALIAS: ${{ secrets.ZAVI_ADMIN_KEY_ALIAS }}
          ZAVI_ADMIN_KEY_PASSWORD: ${{ secrets.ZAVI_ADMIN_KEY_PASSWORD }}
          ZAVI_UPLOAD_KEYSTORE_B64: ${{ secrets.ZAVI_UPLOAD_KEYSTORE_B64 }}
          ZAVI_UPLOAD_STORE_PASSWORD: ${{ secrets.ZAVI_UPLOAD_STORE_PASSWORD }}
          ZAVI_UPLOAD_KEY_ALIAS: ${{ secrets.ZAVI_UPLOAD_KEY_ALIAS }}
          ZAVI_UPLOAD_KEY_PASSWORD: ${{ secrets.ZAVI_UPLOAD_KEY_PASSWORD }}
        run: |
          python3 - <<'PY'
          import os
          per_app={
              'ONE':['ZAVI_ONE_KEYSTORE_BASE64','ZAVI_ONE_STORE_PASSWORD','ZAVI_ONE_KEY_ALIAS','ZAVI_ONE_KEY_PASSWORD'],
              'ADMIN':['ZAVI_ADMIN_KEYSTORE_BASE64','ZAVI_ADMIN_STORE_PASSWORD','ZAVI_ADMIN_KEY_ALIAS','ZAVI_ADMIN_KEY_PASSWORD'],
          }
          shared=['ZAVI_UPLOAD_KEYSTORE_B64','ZAVI_UPLOAD_STORE_PASSWORD','ZAVI_UPLOAD_KEY_ALIAS','ZAVI_UPLOAD_KEY_PASSWORD']
          for app,names in per_app.items():
              missing=[k for k in names if not os.getenv(k)]
              if missing:
                  print(f'::warning title={app} RELEASE BLOCKED::Missing signing inputs: {", ".join(missing)}')
              else:
                  print(f'{app}: signing inputs present; keystore validation and original installation certificate match NOT VERIFIED.')
          if all(os.getenv(k) for k in shared):
              print('Shared upload signing inputs also present; do not substitute for per-app keys without certificate matching.')
          print('THIS RUN PRODUCES DEBUG QA APKS ONLY. This signing audit is NOT an approval to publish or upgrade installations.')
          PY
