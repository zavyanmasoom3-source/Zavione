name: ZAVI camera fix Android APKs (test builds)
on:
  push:
    branches:
      - zavi-camera-fix-v65-43-20261024
    paths:
      - 'android-build/**'
      - '.github/workflows/zavi-camera-v65-43-build.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  android-apk:
    name: Build ${{ matrix.mode }} Android camera fix APK
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        include:
          - mode: one
            folder: ZAVI_ONE
            file: ZAVI_ONE_V65_44_DISPLAY_TEST.apk
          - mode: admin
            folder: ZAVI_ONE_ADMIN
            file: ZAVI_ONE_ADMIN_V1_3_3_DISPLAY_TEST.apk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: SDK 36
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n1)"; fi
          "$SDKMANAGER" --install "platforms;android-36" "build-tools;36.0.0"
      - name: Ignore obsolete V60 desktop-only patch in Android staging
        if: matrix.mode == 'one'
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('windows-build/fetch-and-stage.mjs')
          s=p.read_text()
          before='if(mode==="one"){applyZaviV60(web);report.version='
          assert before in s, 'Unexpected staging script layout'
          p.write_text(s.replace(before,'if(mode==="one"){report.version='))
          PY
      - name: Stage latest published web files
        run: |
          set -euo pipefail
          node windows-build/fetch-and-stage.mjs "${{ matrix.mode }}"
          mkdir -p android-build/app/src/main/assets
          cp -a "windows-output/${{ matrix.folder }}/web/." android-build/app/src/main/assets/
          test -s android-build/app/src/main/assets/index.html
      - name: Apply saved display density and hide platform name from customer sales invoices
        shell: bash
        run: |
          set -euo pipefail
          node --check android-build/patches/zavi-display-scale-v6544.js
          node --check android-build/patches/patch-android-ui-v6544.mjs
          node android-build/patches/patch-android-ui-v6544.mjs "android-build/app/src/main/assets" "${{ matrix.mode }}"
          test -s android-build/app/src/main/assets/zavi-display-scale-v6544.js
          grep -Fq 'zavi-display-scale-v6544.js' android-build/app/src/main/assets/index.html
          if [ "${{ matrix.mode }}" = one ]; then
            if test -f android-build/app/src/main/assets/invoice.html; then
              ! grep -q '<b>ZAVI ONE</b>' android-build/app/src/main/assets/invoice.html
            fi
          fi
      - name: Configure app icon
        run: |
          mkdir -p android-build/app/src/main/res/drawable-nodpi
          cp "android-build/icons/${{ matrix.mode }}.webp" android-build/app/src/main/res/drawable-nodpi/zavi_launcher_image.webp
      - name: Build and sign debug APK for test-only installs
        working-directory: android-build
        run: gradle --no-daemon --stacktrace -PzaviApp=${{ matrix.mode }} :app:assembleDebug
      - name: Verify signed APK and camera configuration
        shell: bash
        run: |
          set -euo pipefail
          APK=android-build/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump permissions "$APK" | tee permissions.txt
          grep -F 'android.permission.CAMERA' permissions.txt
          unzip -Z1 "$APK" | grep -Fx 'classes.dex'
          unzip -Z1 "$APK" | grep -Fx 'assets/index.html'
          mkdir -p dist
          cp "$APK" "dist/${{ matrix.file }}"
          sha256sum "dist/${{ matrix.file }}" > "dist/${{ matrix.file }}.sha256"
      - name: Publish test APK directly to private GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: zavi-display-v65-44-test-20261024
        shell: bash
        run: |
          set -euo pipefail
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --target "${GITHUB_SHA}" --prerelease --title "ZAVI display size + camera fixes - Android QA test builds" --notes "QA only: display-size selector added in 3 languages, customer invoice branding removed, native camera permissions enabled. APK uses test signing and is not guaranteed to update installed previous APKs. Physical device testing still required." || gh release view "$TAG" >/dev/null
          fi
          gh release upload "$TAG" "dist/${{ matrix.file }}" "dist/${{ matrix.file }}.sha256" --clobber
