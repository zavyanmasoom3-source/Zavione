name: ZAVI V66.62 ORIGINAL blue design - 62MB QA APK

on:
  workflow_dispatch:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/zavi-v6662-original-design-qa.yml'
      - 'tools/v6662/**'
      - 'android-build/**'

permissions:
  contents: read

jobs:
  build-original-design:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Prepare Node and Java 17
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Restore exact historical native Android wrapper for original-design QA
        shell: bash
        run: |
          set -euo pipefail
          HISTORIC=2657ab68531bb3c6877e05fc2bee67ba59ab17f8
          git fetch --no-tags --depth=1 origin "$HISTORIC"
          test "$(git rev-parse FETCH_HEAD)" = "$HISTORIC"
          for path in \
            android-build/app/src/main/java/com/zavione/mobile/MainActivity.java \
            android-build/app/src/main/AndroidManifest.xml \
            android-build/app/src/main/res/xml/zavi_camera_paths.xml \
            android-build/app/src/main/res/drawable/ic_launcher.xml \
            android-build/app/src/main/res/values/styles.xml; do
            git show "$HISTORIC:$path" > "$path"
          done
          mkdir -p android-build/app/src/main/res/drawable-nodpi
          git show "$HISTORIC:android-build/icons/one.webp" > android-build/app/src/main/res/drawable-nodpi/zavi_owner_logo.webp
          python3 - <<'PY'
          from pathlib import Path
          m=Path('android-build/app/src/main/AndroidManifest.xml')
          s=m.read_text()
          assert s.count('android:icon="@drawable/ic_launcher"')==1
          assert s.count('android:roundIcon="@drawable/ic_launcher"')==1
          s=s.replace('android:icon="@drawable/ic_launcher"','android:icon="@drawable/zavi_owner_logo"')
          s=s.replace('android:roundIcon="@drawable/ic_launcher"','android:roundIcon="@drawable/zavi_owner_logo"')
          m.write_text(s)
          PY
          echo 'Historic native wrapper restored from exact successful release build commit.'
          
      - name: Download exact 62 MB historical APK (not current redesign)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p original-baseline qa-output
          gh release download zavi-v6662-one-debug-qa --repo "$GITHUB_REPOSITORY" --pattern 'ZAVI_one_V6662_DEBUG_QA.apk' --dir original-baseline
          test -s original-baseline/ZAVI_one_V6662_DEBUG_QA.apk
          sha256sum original-baseline/ZAVI_one_V6662_DEBUG_QA.apk

      - name: Restore verified historical WebView files and ONLY minimal bug fixes
        shell: bash
        run: |
          set -euo pipefail
          rm -rf android-build/app/src/main/assets
          python3 tools/v6662/restore_legacy_assets.py \
            --apk original-baseline/ZAVI_one_V6662_DEBUG_QA.apk \
            --dest android-build/app/src/main/assets \
            --report qa-output/original-design-provenance.json
          test -s android-build/app/src/main/assets/models/ggml-base-q5_1.bin
          ! grep -q 'zavi-dual-design-v1.css' android-build/app/src/main/assets/index.html
          ! grep -q 'zavi-showcase-v6668.css' android-build/app/src/main/assets/index.html
          grep -q 'legacy-ui-fixes.css' android-build/app/src/main/assets/index.html

      - name: Set up Android build tools
        shell: bash
        run: |
          set -euo pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-36" "build-tools;36.0.0" >/dev/null
          chmod +x android-build/gradlew

      - name: Compile NEW side-by-side QA APK with original 62MB resources
        shell: bash
        working-directory: android-build
        run: |
          set -euo pipefail
          ./gradlew --no-daemon :app:assembleDebug -PzaviApp=one -PzaviLegacyBaselineQa=true -PzaviProduction=false

      - name: Verify signed debug APK, untouched old resources, package, version
        shell: bash
        run: |
          set -euo pipefail
          SOURCE="android-build/app/src/main/assets"
          APK="android-build/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | head -5
          unzip -p "$APK" assets/index.html | cmp - "$SOURCE/index.html"
          unzip -p "$APK" assets/models/ggml-base-q5_1.bin | sha256sum | cut -d' ' -f1 > /tmp/model-embedded.sha
          sha256sum "$SOURCE/models/ggml-base-q5_1.bin" | cut -d' ' -f1 > /tmp/model-original.sha
          cmp /tmp/model-embedded.sha /tmp/model-original.sha
          python3 - <<'PY'
          from pathlib import Path
          import zipfile,json,hashlib
          apk=Path('android-build/app/build/outputs/apk/debug/app-debug.apk')
          with zipfile.ZipFile(apk) as z:
              assert z.testzip() is None
              assets=[x for x in z.namelist() if x.startswith('assets/') and not x.endswith('/')]
              assert len(assets)>=266, f"Unexpected asset count {len(assets)}"
              assert 'assets/models/ggml-base-q5_1.bin' in assets
              html=z.read('assets/index.html').decode('utf-8')
              assert 'data-zavi-legacy-repair' in html
              assert not any(x in html for x in ('zavi-dual-design-v1.css','zavi-showcase-v6668.css','zavi-pdf-final-v6760.css'))
          data=json.loads(Path('qa-output/original-design-provenance.json').read_text())
          data.update(qa_apk_sha256=hashlib.sha256(apk.read_bytes()).hexdigest(),
                      qa_apk_size=apk.stat().st_size,
                      embedded_assets=len(assets),
                      verification='signed debug and original WebView asset hashes verified; device/accounting QA still required')
          Path('qa-output/original-design-provenance.json').write_text(json.dumps(data,indent=2,ensure_ascii=False)+'\n')
          print(json.dumps(data,indent=2))
          PY
          cp "$APK" qa-output/ZAVI_ONE_V6662_ORIGINAL_DESIGN_FIXED_QA.apk
          sha256sum qa-output/*.apk

      - name: Assert complete 265-file historical business-code integrity
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/v6662/verify_original_apk_assets.py \
            --original original-baseline/ZAVI_one_V6662_DEBUG_QA.apk \
            --qa android-build/app/build/outputs/apk/debug/app-debug.apk \
            --css tools/v6662/legacy-ui-fixes.css \
            --output qa-output/verified-original-source-assets.json

      - name: Upload the REAL 62MB old-design QA APK and provenance
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ZAVI_ONE_V6662_OLD_BLUE_DESIGN_QA_APK
          path: qa-output/
          retention-days: 14
          if-no-files-found: warn
