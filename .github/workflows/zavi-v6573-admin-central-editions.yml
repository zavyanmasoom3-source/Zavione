name: ZAVI ONE ADMIN 1.4.20 - Central control for all 20 business editions
on:
  push:
    branches: [zavi-v6573-industry-editions-20261026]
    paths: ['.github/workflows/zavi-v6573-admin-central-editions.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  admin_android:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Stage the original ADMIN 1.4.19 and all 20 edition counts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p staging
          gh release download zavi-6572-admin1419-trial7-offline-assistant-qa-20261026 --pattern 'ZAVI_ONE_ADMIN_V1_4_19_TRIAL7_QA.apk*' --dir staging
          expected=$(awk 'NR==1{print $1}' staging/ZAVI_ONE_ADMIN_V1_4_19_TRIAL7_QA.apk.sha256)
          echo "$expected  staging/ZAVI_ONE_ADMIN_V1_4_19_TRIAL7_QA.apk" | sha256sum -c
          python3 industry-build/prepare_admin.py --apk staging/ZAVI_ONE_ADMIN_V1_4_19_TRIAL7_QA.apk --web android-build/app/src/main/assets
          node --check android-build/app/src/main/assets/zavi-admin-industry-overview.js
          node --check android-build/app/src/main/assets/zavi-v6572-admin-trial7.js
          grep -q 'zavi-admin-industry-overview.js' android-build/app/src/main/assets/index.html
      - name: Configure unique QA admin ID, retain original owner-only app logic
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('android-build/app/build.gradle');s=p.read_text()
          pairs=[
          ("admin ? 'com.zavione.one.admin' : 'com.zavione.one'","admin ? 'com.zavione.one.admin.editionsqa' : 'com.zavione.one'"),
          ("versionCode admin ? 4127 : 6554","versionCode admin ? 4160 : 6554"),
          ("versionName admin ? '1.3.7' : '65.54'","versionName admin ? '1.4.20-editions-qa' : '65.54'"),
          ("admin ? 'ZAVI ONE ADMIN' : 'ZAVI ONE'","admin ? 'ZAVI ONE ADMIN EDITIONS QA' : 'ZAVI ONE'")]
          for a,b in pairs:
           assert s.count(a)==1,a;s=s.replace(a,b)
          assert 'targetSdk 36' in s and 'signingConfig signingConfigs.debug' in s
          p.write_text(s)
          PY
          mkdir -p android-build/app/src/main/res/drawable-nodpi
          cp android-build/icons/admin.webp android-build/app/src/main/res/drawable-nodpi/zavi_launcher_image.webp
      - name: Build, verify and publish owner ADMIN APK to private Git branch
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ];then SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n1)";fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platforms;android-36" "build-tools;36.0.0"
          (cd android-build && gradle --no-daemon -PzaviApp=admin :app:assembleRelease)
          APK=android-build/app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs --verbose "$APK" | grep -q 'Verified using v2 scheme'
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | grep -Fq "com.zavione.one.admin.editionsqa"
          unzip -Z1 "$APK" | grep -Fx assets/zavi-admin-industry-overview.js
          unzip -Z1 "$APK" | grep -Fx assets/zavi-v6572-admin-trial7.js
          unzip -Z1 "$APK" | grep -Fx assets/zavi-v6570-admin-offline.js
          mkdir -p industry-delivery
          cp "$APK" industry-delivery/ZAVI_ONE_ADMIN_V1_4_20_20_INDUSTRIES_QA.apk
          (cd industry-delivery && sha256sum ZAVI_ONE_ADMIN_V1_4_20_20_INDUSTRIES_QA.apk > ZAVI_ONE_ADMIN_V1_4_20_20_INDUSTRIES_QA.apk.sha256)
          git config user.name 'ZAVI Owner ADMIN QA'
          git config user.email 'zavi-admin-ci@users.noreply.github.com'
          git checkout -B zavi-v6573-admin-android-qa
          git add -f industry-delivery
          git commit -m 'artifact(admin): 20 sector central owner management QA APK'
          git push origin HEAD:refs/heads/zavi-v6573-admin-android-qa
          echo "ADMIN APK delivered to private source branch"
  admin_windows:
    runs-on: windows-2022
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Stage exact ADMIN 1.4.19 full app and 20 trade management
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Force -Path staging | Out-Null
          gh release download zavi-6572-admin1419-trial7-offline-assistant-qa-20261026 --pattern "ZAVI_ONE_ADMIN_V1_4_19_TRIAL7_QA.apk*" --dir staging
          if ($LASTEXITCODE -ne 0){throw "Base ADMIN APK missing"}
          $apk="staging/ZAVI_ONE_ADMIN_V1_4_19_TRIAL7_QA.apk"
          $expected=((Get-Content "$apk.sha256" -TotalCount 1).Split(" ",[System.StringSplitOptions]::RemoveEmptyEntries))[0].ToLowerInvariant()
          $actual=(Get-FileHash "$apk" -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected){throw "Master sha mismatch"}
          python industry-build/prepare_admin.py --apk $apk --web windows-output/ZAVI_ONE_ADMIN/web --desktop
          if ($LASTEXITCODE -ne 0){throw "ADMIN desktop stage failed"}
          node --check windows-output/ZAVI_ONE_ADMIN/main.cjs
          node --check windows-output/ZAVI_ONE_ADMIN/web/zavi-admin-industry-overview.js
      - name: Build complete Windows 10/11 setup with original ADMIN security and industry console
        shell: pwsh
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          $ErrorActionPreference='Stop'
          Push-Location windows-output/ZAVI_ONE_ADMIN
          npm install --no-audit --no-fund
          if ($LASTEXITCODE -ne 0){throw 'Electron install failed'}
          npm test
          if ($LASTEXITCODE -ne 0){throw 'Electron checks failed'}
          npm run dist:win
          if ($LASTEXITCODE -ne 0){throw 'Windows setup compile failed'}
          Pop-Location
      - name: Verify and privately publish central ADMIN Windows Setup
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $source="windows-output/ZAVI_ONE_ADMIN/dist/Setup_ZAVI_ONE_ADMIN_1_4_20_Industry_QA.exe"
          if (!(Test-Path $source)){throw 'Installer missing'}
          $size=(Get-Item $source).Length
          if ($size -lt 30000000 -or $size -ge 104857600){throw "Installer too large for GitHub Git file upload: $size"}
          New-Item -ItemType Directory -Force -Path industry-delivery | Out-Null
          Copy-Item $source industry-delivery/
          $hash=(Get-FileHash $source -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  Setup_ZAVI_ONE_ADMIN_1_4_20_Industry_QA.exe" | Set-Content industry-delivery/Setup_ZAVI_ONE_ADMIN_1_4_20_Industry_QA.exe.sha256 -Encoding ascii
          git config user.name 'ZAVI Owner ADMIN QA'
          git config user.email 'zavi-admin-ci@users.noreply.github.com'
          git checkout -B zavi-v6573-admin-windows-qa
          git add -f industry-delivery
          git commit -m 'artifact(admin): 20 business types central owner Windows Setup QA'
          if ($LASTEXITCODE -ne 0){throw 'Git commit failed'}
          git push origin HEAD:refs/heads/zavi-v6573-admin-windows-qa
          if ($LASTEXITCODE -ne 0){throw 'Git push failed'}
