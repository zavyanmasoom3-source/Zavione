name: Stage 3 locale parity audit
on:
  push:
    branches:
      - dev
    paths:
      - 'app-source/one/**'
      - 'app-source/admin/**'
      - 'scripts/stage3-locale-audit.cjs'
      - '.github/workflows/stage3-locale-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  locale-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Print source diagnostics
        shell: bash
        run: |
          set -euxo pipefail
          pwd
          git rev-parse HEAD
          node --version
          ls -la scripts
          for app in one admin; do
            for lang in fa ps en; do
              test -s "app-source/$app/$lang.json" || { echo "::error file=app-source/$app/$lang.json::Missing or empty dictionary"; exit 1; }
            done
            test -s "app-source/$app/index.html" || { echo "::error file=app-source/$app/index.html::Missing or empty index"; exit 1; }
          done
      - name: Validate all locale dictionaries and HTML bootstrap
        run: node scripts/stage3-locale-audit.cjs
