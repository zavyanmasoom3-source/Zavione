plugins { id 'com.android.application' }

String appVariant = providers.gradleProperty("zaviApp").getOrElse("one")
if (!(appVariant in ["one", "admin"])) {
    throw new GradleException("zaviApp must be one or admin")
}
boolean admin = appVariant == "admin"
boolean productionMode = providers.gradleProperty("zaviProduction").getOrElse("false").toBoolean()
boolean legacyBaselineQa = providers.gradleProperty("zaviLegacyBaselineQa").getOrElse("false").toBoolean()
if (legacyBaselineQa && productionMode) {
    throw new GradleException("Legacy baseline is for isolated debug QA; never sign as production")
}

File stagedAssets = file("src/main/assets")
if (!new File(stagedAssets, "index.html").isFile()) {
    throw new GradleException(
        "ZAVI Android build requires staged web assets at " + stagedAssets +
        " (missing index.html); refusing to produce an incomplete APK."
    )
}


if (productionMode) {
    for (String name in ["ZAVI_KEYSTORE_PATH", "ZAVI_KEYSTORE_PASSWORD", "ZAVI_KEY_ALIAS", "ZAVI_KEY_PASSWORD"]) {
        if (!System.getenv(name)) {
            throw new GradleException("Production signing missing: " + name)
        }
    }
}


/*
 * Production UPDATE gate: a same-package Android upgrade must be signed by the
 * ORIGINAL installed app certificate. Public fingerprints below are from the
 * immutable historical ONE/ADMIN APKs, not secret signing material.
 * This intentionally fails closed while the historical signing keys differ.
 * A distinct-signing-lineage migration or user-data export/import requires
 * separate device-level approval and verification.
 */
if (productionMode) {
    final String expectedInstalledFingerprint = admin
        ? "1e1ce68d63626e29435c3530106e6853dc7a25343a97354281d2084b2c5457f7"
        : "49df408626e342d6a6e6c6f5cd2c27b6cfabdc1be5eab113cdafd19b30683f38"
    File keystoreFile = file(System.getenv("ZAVI_KEYSTORE_PATH"))
    String keyAlias = System.getenv("ZAVI_KEY_ALIAS")
    String storePassword = System.getenv("ZAVI_KEYSTORE_PASSWORD")
    java.security.cert.Certificate publicCertificate = null
    for (String storeFormat : ["PKCS12", "JKS"]) {
        try {
            java.security.KeyStore keyStore = java.security.KeyStore.getInstance(storeFormat)
            keystoreFile.withInputStream { stream ->
                keyStore.load(stream, storePassword.toCharArray())
            }
            publicCertificate = keyStore.getCertificate(keyAlias)
            if (publicCertificate != null) break
        } catch (Exception ignored) {
            // The other supported keystore format may still be valid.
        }
    }
    if (publicCertificate == null) {
        throw new GradleException(
            "ZAVI production update blocked: the signing certificate alias cannot be verified."
        )
    }
    String actualFingerprint = java.security.MessageDigest
        .getInstance("SHA-256").digest(publicCertificate.getEncoded()).encodeHex().toString()
    if (actualFingerprint != expectedInstalledFingerprint) {
        throw new GradleException(
            "ZAVI production update blocked: signing certificate DOES NOT MATCH the archived " +
            "installed application identity. Never distribute as an in-place update. " +
            "A separately tested backup/import migration is required."
        )
    }
}

android {
    namespace 'com.zavione.mobile'
    compileSdk 36

    signingConfigs {
        production {
            if (productionMode) {
                storeFile file(System.getenv("ZAVI_KEYSTORE_PATH"))
                storePassword System.getenv("ZAVI_KEYSTORE_PASSWORD")
                keyAlias System.getenv("ZAVI_KEY_ALIAS")
                keyPassword System.getenv("ZAVI_KEY_PASSWORD")
            }
        }
    }

    defaultConfig {
        applicationId admin ? 'com.zavione.one.admin' : 'com.zavione.one'
        minSdk 26
        targetSdk 36
        versionCode admin ? (legacyBaselineQa ? 4171 : 4170) : (legacyBaselineQa ? 6681 : 6679)
        versionName admin ? (legacyBaselineQa ? '1.4.54-original-design-qa1' : '1.4.70-pdf-final') : (legacyBaselineQa ? '66.62-original-design-qa1' : '66.79-pdf-final')
        resValue 'string', 'app_name', admin ? 'ZAVI ONE ADMIN' : 'ZAVI ONE'
    }

    buildTypes {
        debug {
            applicationIdSuffix legacyBaselineQa ? '.legacyqa' : '.dev'
            versionNameSuffix '-debug'
        }
        release {
            minifyEnabled false
            shrinkResources false
            debuggable false
            // Never produce a release-labeled APK signed with the debug identity.
        if (productionMode) {
            signingConfig signingConfigs.production
        }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging {
        resources {
            excludes += ['/META-INF/{AL2.0,LGPL2.1}']
        }
    }
}

configurations.configureEach {
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
}

dependencies {
    implementation 'androidx.webkit:webkit:1.13.0'
    implementation 'androidx.core:core:1.13.1'
    implementation 'androidx.biometric:biometric:1.1.0'
}

 // Fail closed for every release task, including assemble, bundle and signing.
 // In-place upgrades additionally require certificate and version verification.
gradle.taskGraph.whenReady { graph ->
    boolean releaseRequested = graph.allTasks.any { task ->
        task.path.startsWith(':app:') && task.name.toLowerCase(java.util.Locale.ROOT).contains('release')
    }
    if (releaseRequested && !productionMode) {
        throw new GradleException(
            'ZAVI release blocked: use -PzaviProduction=true and validated production signing credentials. A debug key is never a release key.'
        )
    }
}
