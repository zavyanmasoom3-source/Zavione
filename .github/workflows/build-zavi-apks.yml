name: ZAVI ONE source-of-truth Android build

on:
  workflow_dispatch:
  pull_request:
    branches: [dev]
  push:
    branches: [dev]
    paths:
      - '.github/workflows/build-zavi-apks.yml'
      - 'android-build/**'
      - 'app-source/one/**'
      - 'app-source/admin/**'

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.app }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: one
            artifact: ZAVI_ONE_DEV_APK
          - app: admin
            artifact: ZAVI_ONE_ADMIN_DEV_APK

    steps:
      - name: Checkout dev source
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platforms;android-36" "build-tools;36.0.0"

      - name: Stage current application source
        shell: bash
        run: |
          set -euo pipefail
          SRC="app-source/${{ matrix.app }}"
          DST="android-build/app/src/main/assets"
          test -f "$SRC/index.html"
          rm -rf "$DST"
          mkdir -p "$DST"
          cp -a "$SRC/." "$DST/"
          test -s "$DST/index.html"

          python3 - <<'PY'
          from pathlib import Path
          app="${{ matrix.app }}"
          p=Path("android-build/app/src/main/assets/index.html")
          s=p.read_text(encoding="utf-8")
          assert len(s) > 5000, f"{app}: index.html unexpectedly small"
          assert "<html" in s.lower() and "</html>" in s.lower(), f"{app}: malformed HTML shell"
          print(app, "source bytes", len(s))
          PY

      - name: Verify Gradle source integrity
        shell: bash
        run: |
          set -euo pipefail
          test -s android-build/app/build.gradle
          ! grep -q '^cat: .*No such file or directory' android-build/app/build.gradle
          chmod +x android-build/gradlew
          cd android-build
          ./gradlew --version
          ./gradlew --no-daemon :app:tasks -PzaviApp=${{ matrix.app }} >/dev/null

      - name: Build fresh debug APK
        working-directory: android-build
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --no-daemon :app:assembleDebug -PzaviApp=${{ matrix.app }} -PzaviProduction=false
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          "${ANDROID_HOME}/build-tools/36.0.0/apksigner" verify --verbose "$APK"
          sha256sum "$APK"

      - name: Prove embedded source is current
        shell: bash
        run: |
          set -euo pipefail
          APK="android-build/app/build/outputs/apk/debug/app-debug.apk"
          unzip -p "$APK" assets/index.html > /tmp/apk-index.html
          cmp --silent "app-source/${{ matrix.app }}/index.html" /tmp/apk-index.html || {
            echo "::error::APK assets do not match current app-source/${{ matrix.app }}"
            exit 1
          }
          echo "Embedded index.html exactly matches current repository source."

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: android-build/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
