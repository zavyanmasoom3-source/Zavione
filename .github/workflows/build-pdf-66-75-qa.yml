name: Archived PDF redesign diagnostic (manual opt-in only)

# This source is NOT the owner's approved original-blue V66.62 Android product.
# Never trigger old/new redesign packaging automatically on dev updates.
on:
  workflow_dispatch:
    inputs:
      confirm_pdf_redesign:
        description: 'Not approved original V66.62. Type I_APPROVE_PDF_DESIGN_QA to run this archived diagnostic.'
        required: true
        type: string

permissions:
  contents: read

jobs:
  android-qa:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.confirm_pdf_redesign == 'I_APPROVE_PDF_DESIGN_QA' }}
    name: Archived PDF redesign diagnostic — NOT approved V66.62 original blue
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          if [ -x "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          else
            SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -name sdkmanager -type f -perm -u+x 2>/dev/null | head -1 || true)"
          fi
          test -n "$SDKMANAGER" && test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"
          test -x "$SDK_ROOT/build-tools/36.0.0/aapt"

      - name: Verify source tests
        run: node --test tests/*.test.cjs

      - name: Clean build ZAVI ONE 66.79
        shell: bash
        run: |
          set -euo pipefail
          rm -rf android-build/app/src/main/assets android-build/app/build android-build/.gradle
          mkdir -p android-build/app/src/main/assets release
          cp -a app-source/one/. android-build/app/src/main/assets/
          chmod +x android-build/gradlew
          ./android-build/gradlew -p android-build --no-daemon --no-build-cache clean
          ./android-build/gradlew -p android-build --no-daemon --no-build-cache -PzaviApp=one :app:assembleDebug
          cp android-build/app/build/outputs/apk/debug/app-debug.apk release/ZAVI_ONE_66.79_pdf_final_QA.apk

      - name: Clean build ZAVI ONE ADMIN 1.4.70
        shell: bash
        run: |
          set -euo pipefail
          rm -rf android-build/app/src/main/assets android-build/app/build android-build/.gradle
          mkdir -p android-build/app/src/main/assets
          cp -a app-source/admin/. android-build/app/src/main/assets/
          ./android-build/gradlew -p android-build --no-daemon --no-build-cache clean
          ./android-build/gradlew -p android-build --no-daemon --no-build-cache -PzaviApp=admin :app:assembleDebug
          cp android-build/app/build/outputs/apk/debug/app-debug.apk release/ZAVI_ONE_ADMIN_1.4.70_pdf_final_QA.apk

      - name: Verify APK identities, versions and PDF payload
        shell: bash
        run: |
          set -euo pipefail
          AAPT="$ANDROID_HOME/build-tools/36.0.0/aapt"
          "$AAPT" dump badging release/ZAVI_ONE_66.79_pdf_final_QA.apk | grep "versionCode='6679' versionName='66.79-pdf-final-debug'"
          "$AAPT" dump badging release/ZAVI_ONE_ADMIN_1.4.70_pdf_final_QA.apk | grep "versionCode='4170' versionName='1.4.70-pdf-final-debug'"
          unzip -l release/ZAVI_ONE_66.79_pdf_final_QA.apk | grep 'assets/zavi-pdf-final-v6760.css'
          unzip -l release/ZAVI_ONE_66.79_pdf_final_QA.apk | grep 'assets/zavi-unified20-manifest.json'
          unzip -p release/ZAVI_ONE_66.79_pdf_final_QA.apk assets/zavi-unified20-manifest.json | grep '66.79-pdf-final'
          unzip -l release/ZAVI_ONE_ADMIN_1.4.70_pdf_final_QA.apk | grep 'assets/zavi-admin-pdf-final-v1467.css'
          unzip -l release/ZAVI_ONE_66.79_pdf_final_QA.apk | grep 'assets/zavi-simple-sections-v678.css'
          unzip -l release/ZAVI_ONE_ADMIN_1.4.70_pdf_final_QA.apk | grep 'assets/zavi-admin-simple-sections-v1469.css'

      - uses: actions/upload-artifact@v4
        with:
          name: ZAVI-PDF-66.79-QA-APKs
          path: release/*.apk
          if-no-files-found: error
          retention-days: 14
