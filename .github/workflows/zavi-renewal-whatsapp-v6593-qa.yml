          for file in *_IPAD_PWA_QA.zip;do sha256sum "$file" > "$file.sha256";done
          cat > README_DARI.txt <<'EOF'
          ZAVI ONE 65.93 and ADMIN 1.4.39 – Renewal WhatsApp reminders and expiry PNG cards; polished clean responsive interface.
          Three separate local Settings sliders — text, full system density and icons — each 50%-150%; viewport and sidebar remain intact.
          The original finance, 20 trade editions, owner-only ADMIN, 7-day subscriptions and ES256 offline enforcement remain unchanged.
          iPads use hosted Safari PWA ZIP; Android APK cannot install on an iPad.
          QA only: user testing, real hardware tests, stable Android signing, and signed Windows packages are still pending.
          EOF
          TAG=zavi-v6593-admin1439-renewal-whatsapp-qa-20261027
          gh release create "$TAG" --target "$GITHUB_SHA" --title "ZAVI ONE V65.93 + ADMIN V1.4.39 Unified Responsive Design QA" --notes-file README_DARI.txt --prerelease || gh release view "$TAG" >/dev/null
          gh release upload "$TAG" ./*.apk ./*.apk.sha256 ./*_IPAD_PWA_QA.zip ./*_IPAD_PWA_QA.zip.sha256 --clobber
          echo "Android published at https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG"
  windows-both:
    needs: android-both
    runs-on: windows-2022
    timeout-minutes: 100
    env:
      GH_TOKEN: ${{ github.token }}
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      ELECTRON_BUILDER_ALLOW_UNRESOLVED_DEPENDENCIES: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Build full ZAVI ONE and ADMIN Windows desktop from matching updated APKs
        shell: pwsh
        run: ./windows-build/build-unified-design-v6593.ps1
      - name: Upload Windows QA installer copies (optional; release binaries are authoritative)
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: ZAVI_ONE_AND_ADMIN_UNIFORM_GRID_WIN64_QA
          path: design-windows-delivery/*
          if-no-files-found: error
          retention-days: 10
