name: ZAVI ONE signed release candidate from current source

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  signed-release:
    name: Signed RC ${{ matrix.app }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: one
            artifact: ZAVI_ONE_66_70_RC_SIGNED_APK
          - app: admin
            artifact: ZAVI_ONE_ADMIN_1_4_61_RC_SIGNED_APK

    steps:
      - name: Checkout selected source revision
        uses: actions/checkout@v4

      - name: Require dev source-of-truth branch
        shell: bash
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_NAME}" != "dev" ]; then
            echo "::error::Signed RC must be dispatched from the dev branch until release approval."
            exit 1
          fi

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platforms;android-36" "build-tools;36.0.0"

      - name: Stage current app source only
        shell: bash
        run: |
          set -euo pipefail
          SRC="app-source/${{ matrix.app }}"
          DST="android-build/app/src/main/assets"
          test -f "$SRC/index.html"
          rm -rf "$DST"
          mkdir -p "$DST"
          cp -a "$SRC/." "$DST/"
          cmp --silent "$SRC/index.html" "$DST/index.html"
          if grep -R -n -E 'ZAVI_ONE_V66_06|V31_SOURCE|release download zavi-migration' .github/workflows/zavi-production-v6623.yml; then
            echo "::error::Legacy APK/source reconstruction reference detected."
            exit 1
          fi

      - name: Load permanent signing identity
        shell: bash
        env:
          ZAVI_KEYSTORE_B64: ${{ matrix.app == 'one' && secrets.ZAVI_ONE_KEYSTORE_BASE64 || secrets.ZAVI_ADMIN_KEYSTORE_BASE64 }}
          ZAVI_KEYSTORE_PASSWORD: ${{ matrix.app == 'one' && secrets.ZAVI_ONE_STORE_PASSWORD || secrets.ZAVI_ADMIN_STORE_PASSWORD }}
          ZAVI_KEY_ALIAS: ${{ matrix.app == 'one' && secrets.ZAVI_ONE_KEY_ALIAS || secrets.ZAVI_ADMIN_KEY_ALIAS }}
          ZAVI_KEY_PASSWORD: ${{ matrix.app == 'one' && secrets.ZAVI_ONE_KEY_PASSWORD || secrets.ZAVI_ADMIN_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in ZAVI_KEYSTORE_B64 ZAVI_KEYSTORE_PASSWORD ZAVI_KEY_ALIAS ZAVI_KEY_PASSWORD; do
            test -n "${!name}" || { echo "::error::Missing signing secret: $name"; exit 1; }
          done
          umask 077
          printf '%s' "$ZAVI_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/zavi-release.jks"
          test -s "$RUNNER_TEMP/zavi-release.jks"
          echo "ZAVI_KEYSTORE_PATH=$RUNNER_TEMP/zavi-release.jks" >> "$GITHUB_ENV"
          echo "ZAVI_KEYSTORE_PASSWORD=$ZAVI_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "ZAVI_KEY_ALIAS=$ZAVI_KEY_ALIAS" >> "$GITHUB_ENV"
          echo "ZAVI_KEY_PASSWORD=$ZAVI_KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Build signed release APK
        working-directory: android-build
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon :app:assembleRelease -PzaviApp=${{ matrix.app }} -PzaviProduction=true
          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          "${ANDROID_HOME}/build-tools/36.0.0/apksigner" verify --verbose "$APK"
          "${ANDROID_HOME}/build-tools/36.0.0/apksigner" verify --print-certs "$APK"
          unzip -p "$APK" assets/index.html > /tmp/apk-index.html
          cmp --silent "../app-source/${{ matrix.app }}/index.html" /tmp/apk-index.html
          sha256sum "$APK"

      - name: Upload signed release candidate
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: android-build/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
