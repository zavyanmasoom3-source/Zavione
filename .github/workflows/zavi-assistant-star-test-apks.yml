name: ZAVI assistant star-only Android test APKs
on:
  push:
    branches: [fix/assistant-launcher-v6608-review]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: one
            original: industry-delivery/ZAVI_ONE_UNIFIED_20_BUSINESSES_V65_83_TRIAL7_REAL_OFFLINE_QA.apk
            sha: fee4ae8ec59a8d433f95c631fe26dfd46fcb8d4916aca01ed5b3090cf5a4d018
          - app: admin
            original: industry-delivery/admin-original.apk
            sha: 4d06d6e76f6e7238ea01b4759f617087c195741267f191d89e0a865aff3f1eea
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Install Android SDK
        run: |
          set -euo pipefail
          M="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$M" ]; then M="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -1)"; fi
          yes | "$M" --licenses >/dev/null || true
          "$M" --install 'platforms;android-36' 'build-tools;36.0.0'
      - name: Regression test
        run: node design-system/test_assistant_star_only_v6608.cjs
      - name: Prepare original APK
        run: |
          set -euo pipefail
          mkdir -p industry-delivery
          if [ "${{ matrix.app }}" = admin ]; then
            git fetch --no-tags --depth=1 origin zavi-admin-v1429-seven-day-store-offline-qa
            git show FETCH_HEAD:industry-delivery/ZAVI_ONE_ADMIN_V1_4_29_STORE_OFFLINE_7D_QA.apk > industry-delivery/admin-original.apk
          fi
          echo "${{ matrix.sha }}  ${{ matrix.original }}" | sha256sum -c
      - name: Stage app and apply badge-only patch
        run: |
          set -euo pipefail
          python3 design-system/build_android_v6598.py --app "${{ matrix.app }}" --apk "${{ matrix.original }}" --expected-sha "${{ matrix.sha }}"
          python3 design-system/apply_single_assistant_v6608.py
          node --check android-build/app/src/main/assets/zavi-single-assistant-fix-v6608.js
          grep -q 'zavi-single-assistant-fix-v6608.js' android-build/app/src/main/assets/index.html
      - name: Build debug APK
        working-directory: android-build
        run: gradle --no-daemon :app:assembleDebug -PzaviAdmin=${{ matrix.app == 'admin' }}
      - name: Verify signed APK
        run: |
          set -euo pipefail
          APK=android-build/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify "$APK"
      - uses: actions/upload-artifact@v4
        with:
          name: ZAVI_${{ matrix.app }}_ASSISTANT_STAR_TEST_APK
          path: android-build/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
