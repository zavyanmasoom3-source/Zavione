name: ZAVI ONE and ADMIN Reference Design APKs in One ZIP
on:
  push:
    branches: [zavi-final-reference-apks-20261025]
    paths:
      - ".github/workflows/zavi-final-reference-both-apks-zip.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  bundle:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Fetch and audit both signed APKs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p installers
          gh release download zavi-final-reference-apks-20261025 \
            --pattern 'ZAVI_ONE_V65_61_REFERENCE_DESIGN_QA.apk*' --dir installers
          gh release download zavi-final-reference-apks-20261025 \
            --pattern 'ZAVI_ONE_ADMIN_V1_4_12_REFERENCE_DESIGN_QA.apk*' --dir installers
          cd installers
          for apk in ZAVI_ONE_V65_61_REFERENCE_DESIGN_QA.apk ZAVI_ONE_ADMIN_V1_4_12_REFERENCE_DESIGN_QA.apk; do
            test -s "$apk"
            expected="$(awk 'NR==1{print $1}' "$apk.sha256")"
            echo "$expected  $apk" | sha256sum -c -
            test "$(stat -c %s "$apk")" -gt 3000000
            unzip -t "$apk" | tail -1
            unzip -Z1 "$apk" | grep -Fx assets/index.html
            unzip -Z1 "$apk" | grep -Fx classes.dex
          done
          unzip -Z1 ZAVI_ONE_V65_61_REFERENCE_DESIGN_QA.apk | grep -Fx assets/zavi-final-reference-store.js
          unzip -Z1 ZAVI_ONE_V65_61_REFERENCE_DESIGN_QA.apk | grep -Fx assets/zavi-final-reference-store.css
          unzip -Z1 ZAVI_ONE_ADMIN_V1_4_12_REFERENCE_DESIGN_QA.apk | grep -Fx assets/zavi-final-reference-admin.css
          sha256sum *.apk > SHA256_CHECKSUMS.txt
          cat > READ_ME_FIRST_DARI.txt <<'README'
          ZAVI ONE 65.61 + ZAVI ONE ADMIN 1.4.12
          Final-reference look / Android QA — 25 October 2026.

          دو فایل APK برای بررسی طراحی روشن و تیره تهیه شدند:
          1) ZAVI_ONE_V65_61_REFERENCE_DESIGN_QA.apk — فروشگاه
          2) ZAVI_ONE_ADMIN_V1_4_12_REFERENCE_DESIGN_QA.apk — مدیریت مرکزی

          تغییرات طراحی:
          - داشبورد مرتب، جستجوی کوچک فعال و کارت‌های گرافیکی
          - صفحه «همه بخش‌ها» به شکل شبکه قابل اسکرول، بدون جستجوی بزرگ
          - «مرکز سلامت» از داشبورد حذف شده، منطق سایر بخش‌ها محفوظ است
          - کارت کوچک نرخ امروز دالر و راه دسترسی به نرخ اصلی
          - حالت روشن/تیره و انیمیشن‌های قابل کنترل
          - ADMIN ظاهر مدیریتی جدید؛ مجوز مالک مرکزی در اصل برنامه unchanged

          نکته بسیار مهم:
          این‌ها دو برنامه مستقل QA هستند و شناسه نصب‌شان با نسخه اصلی متفاوت است.
          این کار از جایگزینی ناخواسته برنامه دارای داده مشتری جلوگیری می‌کند.
          نسخه‌های QA از امضای موقت Build استفاده می‌کنند.
          پیش از انتقال دستگاه یا حذف برنامه قبلی، معاملات ارسال‌نشده را
          همگام و نسخه پشتیبان معتبر بگیرید.
          این بسته هنوز تضمین برابری پیکسل‌به‌پیکسل با تصاویر، کارکرد صددرصد
          بدون خطا، یا آزمون واقعی چاپ/دوربین/آفلاین/ورود ابری نیست.
          کارهای حسابداری، دستگاه‌ها، مشترکان و محدودیت‌های دسترسی را
          پیش از عرضه عمومی با حساب آزمایشی روی دستگاه واقعی تست کنید.
          README
          cd ..
          zip -9 -q -j ZAVI_ONE_ADMIN_REFERENCE_DESIGN_APKS_2026_10_25.zip \
            installers/ZAVI_ONE_V65_61_REFERENCE_DESIGN_QA.apk \
            installers/ZAVI_ONE_ADMIN_V1_4_12_REFERENCE_DESIGN_QA.apk \
            installers/SHA256_CHECKSUMS.txt \
            installers/READ_ME_FIRST_DARI.txt
          unzip -t ZAVI_ONE_ADMIN_REFERENCE_DESIGN_APKS_2026_10_25.zip | tail -1
          test "$(unzip -Z1 ZAVI_ONE_ADMIN_REFERENCE_DESIGN_APKS_2026_10_25.zip | grep -c '\.apk$')" -eq 2
          sha256sum ZAVI_ONE_ADMIN_REFERENCE_DESIGN_APKS_2026_10_25.zip > ZAVI_ONE_ADMIN_REFERENCE_DESIGN_APKS_2026_10_25.zip.sha256
          echo "PASS: 2 signed app bundles; SHA256, required UI source, and ZIP integrity"
      - name: Publish signed APK collection
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: zavi-final-reference-both-apks-20261025
        run: |
          set -euo pipefail
          if ! gh release view "$TAG" >/dev/null 2>&1;then
            gh release create "$TAG" --target "$GITHUB_SHA" --prerelease \
              --title "ZAVI ONE 65.61 + ADMIN 1.4.12 — reference UI Android QA (both APKs)" \
              --notes "Two individually QA-signed Android applications: polished mobile home, compact search, all-sections menu, light/dark theme and owner ADMIN visual shell. Original accounting/auth source preserved. Tested APK file hashes and content only; actual device end-to-end and exact conceptual pixel parity remain to verify."
          fi
          gh release upload "$TAG" \
            ZAVI_ONE_ADMIN_REFERENCE_DESIGN_APKS_2026_10_25.zip \
            ZAVI_ONE_ADMIN_REFERENCE_DESIGN_APKS_2026_10_25.zip.sha256 --clobber
