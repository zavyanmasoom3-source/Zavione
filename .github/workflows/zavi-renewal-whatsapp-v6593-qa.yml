name: ZAVI ONE V65.93 + ADMIN 1.4.39 Renewal WhatsApp QA
on:
  push:
    branches: [zavi-v6593-admin1439-renewal-whatsapp-play-candidate]
    paths:
      - '.github/workflows/zavi-renewal-whatsapp-v6593-qa.yml'
      - 'design-system/**'
      - 'windows-build/build-unified-design-v6593.ps1'
      - 'windows-build/prepare-v6593-desktop.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  android-both:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.13'}
      - name: Install Android tools
        shell: bash
        run: |
          set -euo pipefail
          M="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$M" ];then M="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -1)";fi
          yes | "$M" --licenses >/dev/null || true
          "$M" --install 'platforms;android-36' 'build-tools;36.0.0'
      - name: Obtain original SHA-verified ZAVI ONE 65.83 and owner ADMIN 1.4.29 binaries
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p design-staging design-delivery
          cp industry-delivery/ZAVI_ONE_UNIFIED_20_BUSINESSES_V65_83_TRIAL7_REAL_OFFLINE_QA.apk design-staging/one.apk
          sha256sum design-staging/one.apk
          echo 'fee4ae8ec59a8d433f95c631fe26dfd46fcb8d4916aca01ed5b3090cf5a4d018  design-staging/one.apk' | sha256sum -c
          git fetch --no-tags --depth=1 origin zavi-admin-v1429-seven-day-store-offline-qa
          git show FETCH_HEAD:industry-delivery/ZAVI_ONE_ADMIN_V1_4_29_STORE_OFFLINE_7D_QA.apk > design-staging/admin.apk
          echo '4d06d6e76f6e7238ea01b4759f617087c195741267f191d89e0a865aff3f1eea  design-staging/admin.apk' | sha256sum -c
      - name: Bundle offline ZXing scanner for Safari iPad and Windows
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix design-system --no-save --no-package-lock --ignore-scripts --no-audit --no-fund esbuild@0.25.12 @zxing/browser@0.2.1
          ./design-system/node_modules/.bin/esbuild design-system/zavi-zxing-entry-v6591.js --bundle --format=iife --target=es2020 --minify --outfile=design-system/zavi-zxing-bundle-v6591.js
          node --check design-system/zavi-zxing-bundle-v6591.js
          test "$(wc -c < design-system/zavi-zxing-bundle-v6591.js)" -gt 80000
          echo 'PASS locally bundled ZXing decoder; no runtime CDN required'
      - name: Package ZAVI ONE design APK and iPad Safari web PWA
        shell: bash
        run: |
          set -euo pipefail
          python3 design-system/build_android_v6593.py --app one --apk design-staging/one.apk --expected-sha fee4ae8ec59a8d433f95c631fe26dfd46fcb8d4916aca01ed5b3090cf5a4d018
          node --check android-build/app/src/main/assets/zavi-unified-v6584.js
          test -s android-build/app/src/main/assets/zavi-real-viewport-v6586.css
          test -s android-build/app/src/main/assets/zavi-three-sizes-v6588.css
          node --check android-build/app/src/main/assets/zavi-three-sizes-v6588.js
          test -s android-build/app/src/main/assets/zavi-landscape-v6589.css
          node --check android-build/app/src/main/assets/zavi-landscape-v6589.js
          test -s android-build/app/src/main/assets/zavi-mobile-rescue-v6590.css
          node --check android-build/app/src/main/assets/zavi-mobile-rescue-v6590.js
          test -s android-build/app/src/main/assets/zavi-premium-renewal-v6593.css
          grep -Fq 'zavi-premium-renewal-v6593.css?v=65.93' android-build/app/src/main/assets/index.html
          grep -Fq 'zavi-store-v6593-premium' android-build/app/src/main/assets/sw.js
          test -s android-build/app/src/main/assets/zavi-camera-menu-v6591.css
          node --check android-build/app/src/main/assets/zavi-camera-scan-v635.js
          node --check android-build/app/src/main/assets/zavi-zxing-bundle-v6591.js
          test "$(wc -c < android-build/app/src/main/assets/zavi-zxing-bundle-v6591.js)" -gt 80000
          python3 - <<'PY91'
          from pathlib import Path
          root=Path('android-build/app/src/main/assets')
          html=(root/'index.html').read_text(encoding='utf8')
          script=(root/'zavi-camera-scan-v635.js').read_text(encoding='utf8')
          sw=(root/'sw.js').read_text(encoding='utf8')
          assert html.count('zavi-zxing-bundle-v6591.js?v=65.91')==1
          assert html.count('zavi-camera-scan-v635.js?v=65.91')==1
          assert 'zavi-camera-menu-v6591.css?v=65.91' in html
          assert html.index('zavi-zxing-bundle-v6591.js')<html.index('zavi-camera-scan-v635.js?v=65.91')
          assert 'window.ZaviZXingV6591' in script
          assert 'navigator.mediaDevices.getUserMedia' in script
          assert 'zaviBarcodeScan' in script and 'zaviWarehouseScan' in script and 'fld_sku' in script
          assert 'zavi-zxing-bundle-v6591.js' in sw
          assert 'zavi-store-v6593-premium' in sw
          print('PASS iPad camera, Windows camera, mobile offline decoder and current 20 business workflows')
          PY91
          python3 design-system/test_html_integrity_v6590.py --web android-build/app/src/main/assets --app one
          python3 - <<'PY90'
          from pathlib import Path
          r=Path('android-build/app/src/main/assets')
          h=(r/'index.html').read_text()
          c=(r/'zavi-mobile-rescue-v6590.css').read_text()
          s=(r/'zavi-mobile-rescue-v6590.js').read_text()
          assert 'zavi-mobile-rescue-v6590.css?v=65.90' in h
          assert 'zavi-mobile-rescue-v6590.js?v=65.90' in h
          assert h.index('zavi-landscape-v6589.css') < h.index('zavi-mobile-rescue-v6590.css')
          assert 'z637AiPanel' in c and 'z637-ai-messages' in c
          assert 'max-height:var(--z90-vh)' in c
          assert 'zavi:visual-viewport' in s and 'location.reload(' not in s
          assert 'zavi-three-sizes-v6588.js?v=65.88' in h
          print('PASS latest full layout, AI overlay and independent sliders on both systems')
          PY90
          grep -Fq 'android:screenOrientation="fullSensor"' android-build/app/src/main/AndroidManifest.xml
          grep -Fq 'orientation|screenSize|smallestScreenSize|keyboardHidden' android-build/app/src/main/AndroidManifest.xml
          grep -Fq 'onConfigurationChanged(Configuration config)' android-build/app/src/main/java/com/zavione/mobile/MainActivity.java
          python3 - <<'PY89'
          from pathlib import Path
          p=Path('android-build/app/src/main/assets')
          index=(p/'index.html').read_text(encoding='utf8')
          css=(p/'zavi-landscape-v6589.css').read_text(encoding='utf8')
          js=(p/'zavi-landscape-v6589.js').read_text(encoding='utf8')
          assert 'zavi-landscape-v6589.css?v=65.89' in index
          assert 'zavi-landscape-v6589.js?v=65.89' in index
          assert 'orientation:landscape' in css and 'max-height:650px' in css
          assert 'zavi:native-configurationchange' in js
          assert 'location.reload(' not in js and 'localStorage.clear(' not in js
          assert 'zavi-three-sizes-v6588.js?v=65.88' in index
          print('PASS landscape/portrait, preserve ledger/lease, independent sliders')
          PY89
          python3 - <<'PY3'
          from pathlib import Path
          js=Path('android-build/app/src/main/assets/zavi-three-sizes-v6588.js').read_text()
          css=Path('android-build/app/src/main/assets/zavi-three-sizes-v6588.css').read_text()
          html=Path('android-build/app/src/main/assets/index.html').read_text()
