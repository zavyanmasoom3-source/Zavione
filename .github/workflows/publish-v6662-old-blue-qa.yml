name: Publish verified V66.62 ONE QA APK for selected dev commit
on:
  workflow_dispatch:
permissions:
  actions: read
  contents: write
jobs:
  publish:
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    steps:
      - name: Download the successful ONE build for this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          run=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow zavi-v6662-original-design-qa.yml --branch dev --commit "$GITHUB_SHA" --status success --limit 1 --json databaseId --jq '.[0].databaseId // empty')
          test -n "$run"
          gh run download "$run" --repo "$GITHUB_REPOSITORY" --name ZAVI_ONE_V6662_OLD_BLUE_DESIGN_QA_APK --dir qa
          cd qa
          file="ZAVI_ONE_V6662_QA_${GITHUB_SHA}.apk"
          hash=$(jq -er 'select(.status == "PASS").qa_apk_sha256' verified-original-source-assets.json)
          echo "$hash  $file" | sha256sum --check -
          gh release create "v6662-one-qa-$GITHUB_SHA" "$file" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease --title "ZAVI ONE V66.62 QA ${GITHUB_SHA:0:8}" --notes "Debug QA build from Actions run $run. SHA256 $hash."
