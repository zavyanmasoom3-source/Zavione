let promptEvent=null;const text={fa:{sub:'— نصب اپلیکیشن',desc:'برای اضافه‌کردن سیستم حسابداری به صفحه اصلی موبایل یا لپ‌تاپ، از مراحل زیر استفاده کنید.',install:'نصب اپلیکیشن',back:'بازکردن سیستم',status:'بررسی فایل‌های نصب',private:'حساب‌ها در مرورگر همین دستگاه نگهداری می‌شوند؛ از یک آدرس ثابت برای برنامه استفاده کنید؛ اطلاعات هر حساب به‌صورت جداگانه نگهداری می‌شود.',ios:'آیفون/آیپد: آدرس را در Safari باز کنید. روی Share بزنید و Add to Home Screen را انتخاب کنید. سپس Add را بزنید.',desktop:'اندروید و کمپیوتر: در Chrome یا Edge از منو گزینه Install app را انتخاب کنید. اگر گزینه Install فعال نیست، یک‌بار صفحه اصلی برنامه را باز کنید و دوباره تلاش کنید.',check:'موجود است',missing:'در دسترس نیست'},ps:{sub:'— د اپلیکیشن نصبول',desc:'د حسابدارۍ اپلیکیشن د موبایل یا کمپیوټر اصلي پاڼې ته اضافه کړئ.',install:'اپلیکیشن نصب کړئ',back:'سیستم پرانیزئ',status:'د نصب فایلونه وګورئ',private:'معلومات په همدغه وسیله کې ساتل کېږي؛ یو ثابت وېب ادرس وکاروئ؛ د هر حساب معلومات جلا ساتل کېږي.',ios:'په آیفون/آیپډ کې یې په Safari کې پرانیزئ، Share او بیا Add to Home Screen وټاکئ.',desktop:'په Android یا کمپیوټر کې په Chrome یا Edge کې Install app وټاکئ. که غیرفعاله وي، اصلي پاڼه خلاصه او بیا هڅه وکړئ.',check:'شته',missing:'نشته'},en:{sub:'— Install the app',desc:'Add this accounting app to your phone or computer home screen.',install:'Install app',back:'Open accounting',status:'Installation file check',private:'Records are stored in this browser. Use one stable app address. Each account has isolated records.',ios:'iPhone/iPad: open the website in Safari, tap Share → Add to Home Screen → Add.',desktop:'Android/desktop: use Chrome or Edge menu → Install app. If disabled, open the main app and try again.',check:'Available',missing:'Unavailable'}};
let lang='fa';const ids={sub:'sub',desc:'desc',install:'installLabel',back:'back',status:'status',private:'private'};function render(){let t=text[lang];document.documentElement.dir=lang==='en'?'ltr':'rtl';document.documentElement.lang=lang==='en'?'en':lang==='ps'?'ps-AF':'fa-AF';for(let k in ids)document.getElementById(ids[k]).textContent=t[k];document.getElementById('steps').textContent=/iP(hone|od|ad)/.test(navigator.userAgent)?t.ios:t.desktop;}document.getElementById('language').onchange=e=>{lang=e.target.value;render()};
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();promptEvent=e});document.getElementById('install').onclick=async()=>{if(promptEvent){promptEvent.prompt();await promptEvent.userChoice;promptEvent=null}else alert(document.getElementById('steps').textContent)};
async function check(){const names=['index.html','manifest.webmanifest','i18n.js','sw.js','icon-192.png','icon-512.png'];const el=document.getElementById('checks');for(let n of names){const li=document.createElement('li');let ok=false;try{const r=await fetch('./'+n,{cache:'no-store'});ok=r.ok}catch(e){}li.className=ok?'good':'bad';li.textContent=n+' — '+text[lang][ok?'check':'missing'];el.appendChild(li)}}
render();check();</script></body></html>
