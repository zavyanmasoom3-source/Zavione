name: ZAVI ONE - 20 distinct business-specific Android APK installers
on:
  push:
    branches: [zavi-v6573-industry-editions-20261026]
    paths:
      - ".github/workflows/zavi-v6573-industry-apks.yml"
      - "industry-build/**"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-24.04
    steps:
      - name: Create private QA release for all business edition APKs
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: zavi-v6573-industry-android-qa-20261026
        run: |
          set -euo pipefail
          if ! gh release view "$TAG" >/dev/null 2>&1;then
            gh release create "$TAG" --target "$GITHUB_SHA" --prerelease \
              --title "ZAVI ONE — 20 specialized business Android QA installers" \
              --notes "20 separate business-specific Android APKs based on ZAVI ONE 65.72 with the full shared accounting, 7-day trial, and bundled offline guide. Distinct package names + human-confirmed original business type settings. All tenant workspaces remain on the ZAVI ONE central backend and owner ADMIN. Separate LOCAL data per edition; migration must be verified. QA signatures only, NOT Google Play or commercially certified."
          fi
  android:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        industry:
          - general
          - pharmacy
          - mobile
          - supermarket
          - wholesale
          - clothing
          - services
          - construction
          - company
          - exchange
          - contractor
          - gold
          - bookstore
          - footwear
          - cosmetics
          - electronics
          - furniture
          - hardware
          - laboratory
          - distribution
    name: "Android industry — ${{ matrix.industry }}"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Install Android API 36 SDK and APK signing verification
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ];then SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)";fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platforms;android-36" "build-tools;36.0.0"
      - name: Get the EXACT latest QA master; verify sha and include offline + trial assistant
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p staging
          gh release download zavi-6572-admin1419-trial7-offline-assistant-qa-20261026 \
             --pattern 'ZAVI_ONE_V65_72_OFFLINE_ASSISTANT_QA.apk*' --dir staging
          sha="$(awk 'NR==1{print $1}' staging/ZAVI_ONE_V65_72_OFFLINE_ASSISTANT_QA.apk.sha256)"
          echo "$sha  staging/ZAVI_ONE_V65_72_OFFLINE_ASSISTANT_QA.apk" | sha256sum -c
          python3 industry-build/prepare_edition.py --industry "${{ matrix.industry }}" \
            --apk staging/ZAVI_ONE_V65_72_OFFLINE_ASSISTANT_QA.apk \
            --web android-build/app/src/main/assets
          python3 - <<'PY'
          import json
          from pathlib import Path
          root=Path('android-build/app/src/main/assets')
          profile=json.loads(Path('industry-build/industry-profiles.json').read_text())
          target='${{ matrix.industry }}'
          p=next(x for x in profile['profiles'] if x['id']==target)
          assert len(profile['profiles'])==20
          for name in ('index.html','v25-business.html','zavi-edition-ui.js','zavi-edition-onboarding.js',
                       'zavi-v6572-offline-accounting-assistant.js','zavi-v6572-store-trial7.js',
                       'zavi-v6570-store-offline.js','offline-license-secure.js'):
            assert (root/name).is_file(), name
          assert p['id'] in (root/'v25-business.html').read_text()
          assert p['id'] in (root/'index.html').read_text()
          print('PASS: full source preserved, edition',p['name']['en'])
          PY
          node --check android-build/app/src/main/assets/zavi-edition-ui.js
          node --check android-build/app/src/main/assets/zavi-edition-onboarding.js
          node --check android-build/app/src/main/assets/zavi-v6572-offline-accounting-assistant.js
      - name: Give this edition a unique Android identity, isolated local records and stable label
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json
          root=Path('industry-build/industry-profiles.json')
          p=next(x for x in json.loads(root.read_text())['profiles'] if x['id']=='${{ matrix.industry }}')
          gradle=Path('android-build/app/build.gradle')
          src=gradle.read_text()
          a="admin ? 'com.zavione.one.admin' : 'com.zavione.one'"
          b="admin ? 'com.zavione.one.admin' : '"+p['androidPackage']+"'"
          assert src.count(a)==1;src=src.replace(a,b)
          a="versionCode admin ? 4127 : 6554"
          b="versionCode admin ? 4127 : "+str(657300+p['number'])
          assert src.count(a)==1;src=src.replace(a,b)
          a="versionName admin ? '1.3.7' : '65.54'"
          b="versionName admin ? '1.3.7' : '65.73-"+p['id']+"-qa'"
          assert src.count(a)==1;src=src.replace(a,b)
          a="admin ? 'ZAVI ONE ADMIN' : 'ZAVI ONE'"
          b="admin ? 'ZAVI ONE ADMIN' : 'ZAVI ONE "+p['name']['en'].replace("'","")+" QA'"
          assert src.count(a)==1;src=src.replace(a,b)
          assert "targetSdk 36" in src and "signingConfig signingConfigs.debug" in src
          gradle.write_text(src)
          PY
          mkdir -p android-build/app/src/main/res/drawable-nodpi
          cp android-build/icons/one.webp android-build/app/src/main/res/drawable-nodpi/zavi_launcher_image.webp
      - name: Compile, QA-sign and verify Android binary (not a production app)
        shell: bash
        run: |
          set -euo pipefail
          (cd android-build && gradle --no-daemon -PzaviApp=one :app:assembleRelease)
          APK=android-build/app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs --verbose "$APK" | grep -E 'Verified using v[123] scheme'
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" > manifest.txt
          grep -F "package: name='com.zavione.one.${{ matrix.industry }}.editionqa'" manifest.txt
          grep -F "targetSdkVersion:'36'" manifest.txt
          unzip -t "$APK" | tail -n1
          unzip -Z1 "$APK" | grep -Fx assets/zavi-edition-ui.js
          unzip -Z1 "$APK" | grep -Fx assets/zavi-v6572-offline-accounting-assistant.js
          unzip -Z1 "$APK" | grep -Fx assets/zavi-v6572-store-trial7.js
          unzip -Z1 "$APK" | grep -Fx assets/v25-business.html
          mkdir -p dist
          filename="ZAVI_ONE_${{ matrix.industry }}_V65_73_QA.apk"
          cp "$APK" "dist/$filename"
          (cd dist && sha256sum "$filename" > "$filename.sha256")
          echo 'Installable QA only. This package has separate local storage and a temporary QA signing key. Do NOT uninstall a previous ZAVI ONE app with pending unsynced transactions. The original account owner confirms the business type and grants from central ADMIN.' > "dist/README_${{ matrix.industry }}.txt"
      - name: Upload each industry separately to the shared owner release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: zavi-v6573-industry-android-qa-20261026
        run: |
          set -euo pipefail
          gh release upload "$TAG" dist/* --clobber
          echo "PASS: ZAVI ONE ${{ matrix.industry }} Android edition, QA-signed, checksum recorded"
