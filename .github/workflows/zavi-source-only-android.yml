name: ZAVI source-only Android build
on:
  workflow_dispatch:
  push:
    branches: [main, fix/independent-source-release-20261103]
    paths:
      - 'app-source/**'
      - 'android-build/**'
      - 'tests/**'
      - 'database/staged/20261103_zavi_warehouse_no_negative_guard.sql'
      - 'database/staged/20261103_zavi_warehouse_permissions_idempotent_rpc.sql'
      - '.github/workflows/zavi-source-only-android.yml'
permissions:
  contents: read
jobs:
  browser-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify original source references, purchase and WhatsApp invariants
        run: |
          node tests/source-feature-parity.cjs
          node --test tests/*.test.cjs
          python3 -m unittest discover -s tests -v
      - name: Install pinned browser test runtime
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Exercise actual app menus, login gates, accounting and device layouts
        run: |
          set -euo pipefail
          python3 -m http.server 8765 --bind 127.0.0.1 --directory app-source > /tmp/zavi-http.log 2>&1 &
          node tests/browser-source.cjs
          node tests/warehouse-browser.cjs
          node tests/warehouse-transfer-browser.cjs
          node tests/barcode-browser.cjs
          node tests/command-parity-browser.cjs
          node tests/display-parity-browser.cjs
          node tests/admin-owner-panel-browser.cjs
          node tests/menu-parity-browser.cjs
          node tests/clean-ui-parity-browser.cjs
      - name: Report browser checks without artifact upload
        if: always()
        run: |
          echo 'Browser test results remain visible in the job logs.' >> "$GITHUB_STEP_SUMMARY"
          for file in browser-source-results.json menu-parity-results.json ui-clean-audit.json qa-parity-results.json; do
            if [ -f "$file" ]; then
              echo "- $file generated" >> "$GITHUB_STEP_SUMMARY"
            fi
          done

  postgres-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: qa
          POSTGRES_DB: zavi_qa
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d zavi_qa"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGUSER: postgres
      PGDATABASE: zavi_qa
      PGPASSWORD: qa
    steps:
      - uses: actions/checkout@v4
      - name: Install psql client
        run: command -v psql || (sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client)
      - name: Load fabricated multi-tenant test schema
        run: psql -v ON_ERROR_STOP=1 -f tests/sql/warehouse_fixture.sql
      - name: Apply only staged stock safety migrations to disposable PostgreSQL
        run: |
          psql -v ON_ERROR_STOP=1 -f database/staged/20261103_zavi_warehouse_no_negative_guard.sql
          psql -v ON_ERROR_STOP=1 -f database/staged/20261103_zavi_warehouse_permissions_idempotent_rpc.sql
      - name: Verify owner-only stock, repeat ID and overspend invariants
        run: psql -v ON_ERROR_STOP=1 -f tests/sql/warehouse_assertions.sql
      - name: Reject one of two concurrent withdrawals from stock of three
        shell: bash
        run: |
          set -euo pipefail
          execute() {
            local id="$1" output="$2"
            if psql -v ON_ERROR_STOP=1 -c "SELECT set_config('request.jwt.claim.sub','aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa',false); SET ROLE authenticated; SELECT public.zavi_warehouse_post_movement('$id','11111111-1111-4111-8111-111111111111','11111111-aaaa-4111-8111-111111111111',NULL,'P1',2.0000,'concurrent');" >"/tmp/$output.txt" 2>&1;then printf '0\n' > "/tmp/$output.status";else printf '1\n' > "/tmp/$output.status";fi
          }
          execute aaaaaaaa-0000-4000-8000-000000000010 a &
          execute aaaaaaaa-0000-4000-8000-000000000011 b &
          wait
          a=$(cat /tmp/a.status);b=$(cat /tmp/b.status)
          if [ "$((a+b))" -ne 1 ];then cat /tmp/a.txt /tmp/b.txt;exit 1;fi
          balance=$(psql -At -v ON_ERROR_STOP=1 -c "SELECT coalesce(sum(CASE WHEN to_warehouse_id='11111111-aaaa-4111-8111-111111111111' THEN quantity WHEN from_warehouse_id='11111111-aaaa-4111-8111-111111111111' THEN -quantity ELSE 0 END),0) FROM public.zavi_warehouse_movements WHERE workspace_id='11111111-1111-4111-8111-111111111111' AND product_ref='P1';")
          case "$balance" in 1|1.0000) echo "One transfer committed, one rejected";; *) echo "::error::Incorrect remaining stock: $balance";exit 1;; esac

  source-only:
    needs: [browser-gate, postgres-gate]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [one, admin]
    steps:
      - uses: actions/checkout@v4
      - name: Require all known original accounting modules and command entry points
        run: node tests/source-feature-parity.cjs
      - name: Test recovery safeguards
        run: python3 -m unittest discover -s tests -v
      - name: Require complete independent source (never extract a legacy APK)
        env:
          ZAVI_APP: ${{ matrix.app }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import importlib.util, os
          spec=importlib.util.spec_from_file_location('recovery','scripts/recover-independent-source.py')
          module=importlib.util.module_from_spec(spec);spec.loader.exec_module(module)
          root=Path('app-source')/os.environ['ZAVI_APP']
          module.validate(root)
          print('Validated independent source and local dependencies:',root)
          PY
      - name: Stage independent application source
        env:
          ZAVI_APP: ${{ matrix.app }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os,shutil
          src=Path('app-source')/os.environ['ZAVI_APP']
          dst=Path('android-build/app/src/main/assets')
          if dst.exists(): shutil.rmtree(dst)
          shutil.copytree(src,dst)
          assert (dst/'index.html').is_file()
          PY
      - name: Restore offline speech model from existing V66.62 QA release
        env:
          GH_TOKEN: ${{ github.token }}
          ZAVI_APP: ${{ matrix.app }}
        run: |
          set -euo pipefail
          mkdir -p original
          if [ "$ZAVI_APP" = one ]; then
            original_name=ZAVI_one_V6662_DEBUG_QA.apk
            source_tag=zavi-v6662-one-debug-qa
          else
            original_name=ZAVI_admin_V6662_DEBUG_QA.apk
            source_tag=zavi-v6662-admin-debug-qa
          fi
          gh release download "$source_tag" --repo "${{ github.repository }}" --pattern "$original_name" --dir original
          python3 - "$original_name" <<'PY'
          import hashlib,sys,zipfile
          from pathlib import Path
          archive=Path('original')/sys.argv[1]
          with zipfile.ZipFile(archive) as z:
           model=z.read('assets/models/ggml-base-q5_1.bin')
          if len(model)<50_000_000 or len(model)>70_000_000:raise SystemExit('Unexpected speech model size')
          out=Path('android-build/app/src/main/assets/models/ggml-base-q5_1.bin')
          out.parent.mkdir(parents=True,exist_ok=True)
          out.write_bytes(model)
          print('Restored offline model',len(model),'SHA256',hashlib.sha256(model).hexdigest())
          PY
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Install Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install 'platforms;android-36' 'build-tools;36.0.0'
      - name: Build and verify source-only APK
        working-directory: android-build
        run: |
          set -euo pipefail
          cp app/src/main/res/drawable/ic_launcher.xml app/src/main/res/drawable/zavi_launcher_image.xml
          gradle --no-daemon :app:assembleDebug -PzaviApp=${{ matrix.app }} -PzaviProduction=false
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify app/build/outputs/apk/debug/app-debug.apk
      - name: Check exact QA APK size and do not claim it contains offline voice model
        working-directory: android-build
        run: |
          python3 - <<'PY'
          from pathlib import Path
          apk=Path('app/build/outputs/apk/debug/app-debug.apk')
          size=apk.stat().st_size
          print('QA APK bytes:',size)
          if not 55_000_000 < size < 85_000_000:
              raise SystemExit('Full-size QA APK missing expected offline model or unexpectedly oversized.')
          print('Full-size QA contains speech model; speech recognition functionality still requires device testing.')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: ZAVI_${{ matrix.app }}_FULL_MODEL_SOURCE_QA_APK
          path: android-build/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 1

  signing-readiness:
    runs-on: ubuntu-latest
    steps:
      - name: Audit existing per-app signing secrets without reading their values
        env:
          ZAVI_ONE_KEYSTORE_BASE64: ${{ secrets.ZAVI_ONE_KEYSTORE_BASE64 }}
          ZAVI_ONE_STORE_PASSWORD: ${{ secrets.ZAVI_ONE_STORE_PASSWORD }}
          ZAVI_ONE_KEY_ALIAS: ${{ secrets.ZAVI_ONE_KEY_ALIAS }}
          ZAVI_ONE_KEY_PASSWORD: ${{ secrets.ZAVI_ONE_KEY_PASSWORD }}
          ZAVI_ADMIN_KEYSTORE_BASE64: ${{ secrets.ZAVI_ADMIN_KEYSTORE_BASE64 }}
          ZAVI_ADMIN_STORE_PASSWORD: ${{ secrets.ZAVI_ADMIN_STORE_PASSWORD }}
          ZAVI_ADMIN_KEY_ALIAS: ${{ secrets.ZAVI_ADMIN_KEY_ALIAS }}
          ZAVI_ADMIN_KEY_PASSWORD: ${{ secrets.ZAVI_ADMIN_KEY_PASSWORD }}
          ZAVI_UPLOAD_KEYSTORE_B64: ${{ secrets.ZAVI_UPLOAD_KEYSTORE_B64 }}
          ZAVI_UPLOAD_STORE_PASSWORD: ${{ secrets.ZAVI_UPLOAD_STORE_PASSWORD }}
          ZAVI_UPLOAD_KEY_ALIAS: ${{ secrets.ZAVI_UPLOAD_KEY_ALIAS }}
          ZAVI_UPLOAD_KEY_PASSWORD: ${{ secrets.ZAVI_UPLOAD_KEY_PASSWORD }}
        run: |
          python3 - <<'PY'
          import os
          per_app={
              'ONE':['ZAVI_ONE_KEYSTORE_BASE64','ZAVI_ONE_STORE_PASSWORD','ZAVI_ONE_KEY_ALIAS','ZAVI_ONE_KEY_PASSWORD'],
              'ADMIN':['ZAVI_ADMIN_KEYSTORE_BASE64','ZAVI_ADMIN_STORE_PASSWORD','ZAVI_ADMIN_KEY_ALIAS','ZAVI_ADMIN_KEY_PASSWORD'],
          }
          shared=['ZAVI_UPLOAD_KEYSTORE_B64','ZAVI_UPLOAD_STORE_PASSWORD','ZAVI_UPLOAD_KEY_ALIAS','ZAVI_UPLOAD_KEY_PASSWORD']
          for app,names in per_app.items():
              missing=[k for k in names if not os.getenv(k)]
              if missing:
                  print(f'::warning title={app} RELEASE BLOCKED::Missing signing inputs: {", ".join(missing)}')
              else:
                  print(f'{app}: signing inputs present; keystore validation and original installation certificate match NOT VERIFIED.')
          if all(os.getenv(k) for k in shared):
              print('Shared upload signing inputs also present; do not substitute for per-app keys without certificate matching.')
          print('THIS RUN PRODUCES DEBUG QA APKS ONLY. This signing audit is NOT an approval to publish or upgrade installations.')
          PY
