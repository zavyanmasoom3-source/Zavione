name: ZAVI ADMIN original 61MB blue-design QA from pinned source
on:
  workflow_dispatch:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/zavi-v6662-admin-original-qa.yml'
      - 'tools/v6662/audit_original_pair.py'
      - 'android-build/app/build.gradle'
permissions:
  contents: read
jobs:
  admin-legacy-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Restore native wrapper from the historical release's exact checkout
        run: |
          set -euo pipefail
          HISTORIC=2657ab68531bb3c6877e05fc2bee67ba59ab17f8
          git fetch --no-tags --depth=1 origin "$HISTORIC"
          test "$(git rev-parse FETCH_HEAD)" = "$HISTORIC"
          for file in \
            android-build/app/src/main/java/com/zavione/mobile/MainActivity.java \
            android-build/app/src/main/AndroidManifest.xml \
            android-build/app/src/main/res/xml/zavi_camera_paths.xml \
            android-build/app/src/main/res/drawable/ic_launcher.xml \
            android-build/app/src/main/res/values/styles.xml; do
            git show "$HISTORIC:$file" > "$file"
          done
          mkdir -p android-build/app/src/main/res/drawable-nodpi
          git show "$HISTORIC:android-build/icons/admin.webp" > android-build/app/src/main/res/drawable-nodpi/zavi_owner_logo.webp
          python3 - <<'PY'
          from pathlib import Path
          m=Path('android-build/app/src/main/AndroidManifest.xml')
          s=m.read_text()
          assert s.count('android:icon="@drawable/ic_launcher"')==1
          assert s.count('android:roundIcon="@drawable/ic_launcher"')==1
          s=s.replace('android:icon="@drawable/ic_launcher"','android:icon="@drawable/zavi_owner_logo"')
          s=s.replace('android:roundIcon="@drawable/ic_launcher"','android:roundIcon="@drawable/zavi_owner_logo"')
          m.write_text(s)
          PY
      - name: Download and hash-check BOTH original APK references
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p original/one original/admin qa-output
          gh release download zavi-v6662-one-debug-qa --repo "$GITHUB_REPOSITORY" --pattern ZAVI_one_V6662_DEBUG_QA.apk --dir original/one
          gh release download zavi-v6662-admin-debug-qa --repo "$GITHUB_REPOSITORY" --pattern ZAVI_admin_V6662_DEBUG_QA.apk --dir original/admin
          rm -rf android-build/app/src/main/assets
          python3 tools/v6662/audit_original_pair.py \
            --one original/one/ZAVI_one_V6662_DEBUG_QA.apk \
            --admin original/admin/ZAVI_admin_V6662_DEBUG_QA.apk \
            --admin-dest android-build/app/src/main/assets \
            --output qa-output/paired-original-source.json
          test -s android-build/app/src/main/assets/models/ggml-base-q5_1.bin
          ! grep -q 'zavi-dual-design-v1.css' android-build/app/src/main/assets/index.html
      - name: Install Android build tools
        run: |
          set -euo pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-36" "build-tools;36.0.0" >/dev/null
          chmod +x android-build/gradlew
      - name: Compile standalone ADMIN QA (do not modify installed app)
        working-directory: android-build
        run: |
          ./gradlew --no-daemon :app:assembleDebug -PzaviApp=admin -PzaviLegacyBaselineQa=true -PzaviProduction=false
      - name: Verify debug signature, isolated package and every original ADMIN file
        run: |
          set -euo pipefail
          APK=android-build/app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | grep -F "package: name='com.zavione.one.admin.legacyqa'"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | grep -F "versionName='1.4.54-original-design-qa1-debug'"
          python3 - <<'PY'
          import hashlib,json,zipfile
          from pathlib import Path
          source=Path('original/admin/ZAVI_admin_V6662_DEBUG_QA.apk')
          qa=Path('android-build/app/build/outputs/apk/debug/app-debug.apk')
          with zipfile.ZipFile(source) as old,zipfile.ZipFile(qa) as new:
            assert old.testzip() is None and new.testzip() is None
            names={n for n in old.namelist() if n.startswith('assets/') and not n.endswith('/')}
            actual={n for n in new.namelist() if n.startswith('assets/') and not n.endswith('/')}
            assert len(names)==174 and names==actual, (len(names),len(actual))
            for name in sorted(names):
              assert old.read(name)==new.read(name), 'Modified original ADMIN business code: '+name
          report={'source':'historical ADMIN 1.4.54 assets','original_assets':174,
            'unchanged_assets':174,'qa_apk_bytes':qa.stat().st_size,
            'qa_apk_sha256':hashlib.sha256(qa.read_bytes()).hexdigest(),
            'native_source_pin':'2657ab68531bb3c6877e05fc2bee67ba59ab17f8',
            'original_look_preserved':True,'release_ready':False,
            'real_device_and_finance_tested':False}
          Path('qa-output/admin-integrity.json').write_text(json.dumps(report,indent=2)+'\n')
          print(json.dumps(report,indent=2))
          PY
          cp "$APK" qa-output/ZAVI_ADMIN_V6662_OLD_BLUE_SOURCE_PRESERVED_QA.apk
      - name: Upload isolated historical ADMIN APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ZAVI_ADMIN_V6662_OLD_BLUE_SOURCE_PRESERVED_QA
          path: qa-output/
          retention-days: 14
          if-no-files-found: warn
